# cmd_vel の仲裁 (twist_mux)。robot_bringup.launch.py が twist_mux_params_file で
# ノードへ直接渡す (twist_mux:=false なら立てない)。
#
# このノードに**既定値は無い**。TwistMux は declare_parameter を一切持たず
# (allow_undeclared_parameters + automatically_declare_parameters_from_overrides)、
# ここに書いた節がそのまま購読トピックになる。**綴りを間違えても黙って動く**
# (その入力が無いだけ) ので、topics: の下の名前と 3 つのキーは崩さないこと。
#
# 出力は cmd_vel_out (launch が cmd_vel_mux へ remap し、本体ドライバがそれを購読)。
# 勝っているトピックがメッセージを受けたときだけ 1 対 1 で中継し、途切れても
# ゼロを出さない。したがってドライバの cmd_vel_timeout は今までどおり効く。
# 配線と優先度の由来は ../README.md。

twist_mux:
  ros__parameters:
    topics:
      nav:                      # 自律走行。nav2 / VI スタックの最終段 (velocity_smoother) の出力
        topic   : cmd_vel       # 購読するトピック。nav2 側の remap は変えていないのでここは /cmd_vel のまま
        timeout : 0.5           # [s] 自律側が勝つのは「出している間 + この時間」だけ。これだけ間が空いたら teleop へ譲る
        priority: 100           # [0-255] 大きいほうが勝つ
      teleop:                   # 遠隔操作と手動の停止指令 (tools/control.sh)
        topic   : cmd_vel_teleop
        timeout : 0.5           # [s] これだけ間が空いたら「出していない」とみなす
        priority: 10            # 自律側より下。自律側が黙っているあいだだけ通る

    # ── 未設定 (書いていない) ──
    # locks:                    # std_msgs/Bool で下位のトピックをまとめて塞ぐ層 (非常停止スイッチ用)
    #   e_stop:
    #     topic   : e_stop
    #     timeout : 0.5
    #     priority: 255
    #
    # locks は **誰も publish しないと塞がったままになる**。isLocked() が
    # `hasExpired() || data` で、受信前のスタンプは 0.0 = 期限切れ扱いだからである
    # (フェイルセーフ側に倒してある)。配信元を用意せずに書くと、その優先度未満の
    # トピックが全部止まって機体が二度と動かない。
