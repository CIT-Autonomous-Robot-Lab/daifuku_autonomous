# 本体ドライバに依存しない部分。**単体では起動しない** (下の raspicat が
# placeholder で exit 1)。**common を先に**、ドライバ側 (compose.rt.yaml /
# compose.original.yaml) を後ろに重ねて渡すこと。選ぶのはリポジトリルートの
# .env の COMPOSE_FILE (.env.example)。
#
# プロジェクト名は固定する。名前付きボリュームがこれを接頭辞に持つので、
# ディレクトリを動かすと colcon のキャッシュが別ボリュームに化ける。**入口 2 つで
# 同じ名前にしてあるので、rt と original を行き来してもキャッシュは同じ**。
name: daifuku-autonomous

# ソースはイメージに焼かずマウントする。イメージが持つのは apt 依存と
# ツールチェーンだけなので、launch / config を直しただけなら何もしなくてよく
# (--symlink-install)、C++ / Rust は `up` で差分ビルド、apt は `build` からやり直し。

services:
  # ビルドして終了するワンショット。**restart を書かないこと** — 正常終了でも
  # 上げ直すので、ビルドが終わるたびに次が始まって止まらなくなる。
  workspace-build:
    build:
      context: ../..
      dockerfile: docker/raspberrypi/Dockerfile
    image: daifuku-autonomous:humble
    container_name: daifuku-autonomous-build
    command: ["build-workspace"]
    network_mode: host
    user: "1000:1000"
    environment:
      HOME: /tmp
      ROS_HOME: /tmp/ros
      ROS_LOG_DIR: /tmp/ros/log
      # colcon の並列数。既定 4 = Pi 4 の全コア。**イメージのビルドには効かない**
      # (build.args に渡していない。渡すと下げた瞬間に層が全部作り直しになる)。
      BUILD_JOBS: ${BUILD_JOBS:-4}
      # cargo を crates.io へ出さないか。**ゲートウェイの無い機体では true が要る**
      # — index を引けないと vi_planner が落ち、set -e で up ごと止まる。新しい
      # クレートを足したときだけ wlan0 を上げて false へ (.env.example)。
      CARGO_NET_OFFLINE: ${CARGO_NET_OFFLINE:-false}
    volumes:
      - ../../src:/opt/ros_ws/src
      - ../../daifuku_autonomous.repos:/opt/ros_ws/daifuku_autonomous.repos:ro
      - autonomous-build:/opt/ros_ws/build
      - autonomous-install:/opt/ros_ws/install
      - autonomous-log:/opt/ros_ws/log

  ros2:
    image: daifuku-autonomous:humble
    container_name: daifuku-autonomous
    depends_on:
      workspace-build:
        condition: service_completed_successfully
    stdin_open: true
    tty: true
    command: ["sleep", "infinity"]
    # PID 1 を tini にする。`sleep` は子を wait しないので、引き取った docker exec
    # の木が **ゾンビとして永久に溜まる**。生きたまま残る木は entrypoint.sh が止める。
    init: true
    # Pi の再起動でも上がる。**デーモンが上げ直すときは depends_on が効かない**
    # (各コンテナが独立に上がる)。install/ が名前付きボリュームに残るのでそれで
    # 動くが、`down -v` の直後だけは `docker compose up -d` を人手で 1 回通すこと。
    restart: unless-stopped
    network_mode: host
    # /dev/shm をホストと共有して Fast DDS の SHM を通す。UDP だけで約 20 参加者へ
    # 配ると Pi 4 のカーネルが飽和し (sys 57% / load 24)、TF が 20 秒以上遅れる。
    ipc: host
    # ホストの ROS プロセス (ubuntu, 1000) と同じ uid で回す。SHM セグメントは 0644
    # なので、root と非 root が混ざると互いのポートを開けず、**Fast DDS 2.6 は UDP へ
    # 落ちないまま**ホスト -> コンテナのトピックが黙って止まる。
    user: "1000:1000"
    environment:
      HOME: /tmp
      ROS_HOME: /tmp/ros
      ROS_LOG_DIR: /tmp/ros/log
      ROS_DOMAIN_ID: ${ROS_DOMAIN_ID:-90}
      ROS_LOCALHOST_ONLY: "0"
      RMW_IMPLEMENTATION: rmw_fastrtps_cpp
      # DDS を lo/eth0 に絞り、届かない wlan0 のロケータを広告させない
      # (負荷時にディスカバリが揺れる)。
      FASTRTPS_DEFAULT_PROFILES_FILE: /etc/fastdds/udp_whitelist.xml
      # **USE_MID360_IMU はここには要らない** (EKF を立てるのは raspicat 側だけ)。
      # **LIDAR / LIDAR_DRIVER は両サービスに要る** — /scan を作る段が navigation /
      # mapping 側に居るので、2 つの launch が「どの LiDAR か」を知る。**食い違うと
      # エラーも警告も出ないまま /scan が空になる。**
      # 場所 (overrides と map) も要らない。どちらの launch も
      # src/daifuku_config/site をファイルとして読む (書き換えは tools/site.sh)。
      LIDAR: ${LIDAR:-mid360}
      LIDAR_DRIVER: ${LIDAR_DRIVER:-true}
    volumes:
      - ./fastdds_udp_whitelist.xml:/etc/fastdds/udp_whitelist.xml:ro
      # 入力デバイス。cgroup 規則は、生成時に居なかったマイナー番号のコントローラを
      # 後から挿しても通すため。**joy_node が居るのは raspicat サービス**のほう。
      - /dev/input:/dev/input:ro
      # ソースと成果物。**src/ は workspace-build と同じものを見せること** —
      # --symlink-install した install/ は src/ への symlink を含むので、
      # 忘れるとリンク切れで launch も config も見えなくなる。
      - ../../src:/opt/ros_ws/src
      - ../../daifuku_autonomous.repos:/opt/ros_ws/daifuku_autonomous.repos:ro
      - autonomous-build:/opt/ros_ws/build
      - autonomous-install:/opt/ros_ws/install
      - autonomous-log:/opt/ros_ws/log
    device_cgroup_rules:
      - "c 13:* r"

  # 機体まるごと。**駆動ドライバ + robot_state_publisher + LiDAR ドライバ + EKF。**
  # navigation と別サービスなのは、ros2 を立て直しても /odom の累積と LiDAR の
  # 初期化を巻き込まないため。**点群を /scan に変える段はここには居ない**
  # (navigation / mapping 側。おかげで地図を変えても raspicat は立て直さなくてよい)。
  #
  # 裏返しに、**ドライバが finalized まで落ちると launch ごと終了し、LiDAR も一緒に
  # 上がり直す** (robot_bringup.launch.py の register_shutting_down_transition)。
  # driver:=raspimouse のときだけ、rtmouse がホストで insmod 済みであることが要る。
  raspicat:
    image: daifuku-autonomous:humble
    container_name: daifuku-raspicat
    depends_on:
      workspace-build:
        condition: service_completed_successfully
    stdin_open: true
    tty: true
    # **本物の command はドライバ側の 2 ファイルが持つ。** 素通りするとどちらの
    # ドライバで走っているか分からないまま上がるので、分かる形で落とす。
    command:
      - /bin/sh
      - -c
      - >-
        echo 'compose.common.yaml を直接起動しないこと。
        compose.rt.yaml か compose.original.yaml を使う (.env の COMPOSE_FILE)。' >&2;
        exit 1
    # ros2 側と同じ理由 (PID 1 の ros2 launch は引き取った孤児を回収しない)。
    init: true
    # install/ が名前付きボリュームに残るので、単独で先に上がっても前回の成果物が見える。
    restart: unless-stopped
    network_mode: host
    ipc: host
    user: "1000:1000"
    # joy_node が掴む /dev/input/event* は root:input 0660 なので uid 1000 では
    # 開けない (下の /dev 丸渡しと cgroup 規則は POSIX の権限には効かない)。
    # 足りないと **エラーも警告も出ないまま /joy に publisher が立たない**。
    # 995 はホストの input グループ (`getent group input`)。違えば INPUT_GID で渡す。
    group_add:
      - "${INPUT_GID:-995}"
    environment:
      HOME: /tmp
      ROS_HOME: /tmp/ros
      ROS_LOG_DIR: /tmp/ros/log
      ROS_DOMAIN_ID: ${ROS_DOMAIN_ID:-90}
      ROS_LOCALHOST_ONLY: "0"
      RMW_IMPLEMENTATION: rmw_fastrtps_cpp
      FASTRTPS_DEFAULT_PROFILES_FILE: /etc/fastdds/udp_whitelist.xml
      # Mid-360 の IMU 融合。**ここ 1 か所だけが読む** (robot_bringup.launch.py が
      # ドライバと EKF の両方を立てるので、片方だけという状態は作れない)。
      USE_MID360_IMU: ${USE_MID360_IMU:-true}
    volumes:
      - ./fastdds_udp_whitelist.xml:/etc/fastdds/udp_whitelist.xml:ro
      - ../../src:/opt/ros_ws/src
      - ../../daifuku_autonomous.repos:/opt/ros_ws/daifuku_autonomous.repos:ro
      - autonomous-build:/opt/ros_ws/build
      - autonomous-install:/opt/ros_ws/install
      - autonomous-log:/opt/ros_ws/log
      # rtmouse は insmod のたびに char デバイスのメジャー番号を動的に取る
      # (実測 497-506)。**メジャー固定の devices: / device_cgroup_rules は、再読込や
      # リブートで古い番号を焼き付けたまま静かにモータ・エンコーダを掴めなくなる**
      # (use_pulse_counters: true では「odom が動かない」という別の顔で出る)。
      # なので /dev を丸ごと渡す — char デバイスについてはほぼ privileged 相当。
      # 狭めるなら rtmouse 側でメジャー番号を固定してここに列挙すること。
      - /dev:/dev
    device_cgroup_rules:
      - "c *:* rwm"

volumes:
  autonomous-build:
  autonomous-install:
  autonomous-log:
