# .env の COMPOSE_FILE で common を先、ドライバ側を後に重ねること。
# 単体では raspicat の placeholder が exit 1 になる。
# ドライバ変更やディレクトリ移動でキャッシュを失わないようプロジェクト名を固定する。
name: daifuku-autonomous

services:
  # restart を付けると正常終了のたびにビルドし直すので、付けないこと。
  workspace-build:
    build:
      context: ../..
      dockerfile: docker/raspberrypi/Dockerfile
    image: daifuku-autonomous:humble
    container_name: daifuku-autonomous-build
    command: ["build-workspace"]
    network_mode: host
    user: "1000:1000"
    environment:
      HOME: /tmp
      ROS_HOME: /tmp/ros
      ROS_LOG_DIR: /tmp/ros/log
      # colcon の並列数。イメージのキャッシュを壊さないよう build.args には渡さない。
      BUILD_JOBS: ${BUILD_JOBS:-4}
      # colcon はパッケージ内の並列数を制限しないため、make / cargo も絞って OOM を防ぐ。
      MAKEFLAGS: -j${BUILD_JOBS:-4}
      CARGO_BUILD_JOBS: ${BUILD_JOBS:-4}
      # ゲートウェイの無い機体では true にしないと index 取得に失敗して up が止まる。
      # 新しいクレートを足すときはネット接続して false にする。
      CARGO_NET_OFFLINE: ${CARGO_NET_OFFLINE:-false}
    volumes:
      - ../../src:/opt/ros_ws/src
      - ../../daifuku_autonomous.repos:/opt/ros_ws/daifuku_autonomous.repos:ro
      - autonomous-build:/opt/ros_ws/build
      - autonomous-install:/opt/ros_ws/install
      - autonomous-log:/opt/ros_ws/log

  ros2:
    image: daifuku-autonomous:humble
    container_name: daifuku-autonomous
    depends_on:
      workspace-build:
        condition: service_completed_successfully
    stdin_open: true
    tty: true
    command: ["sleep", "infinity"]
    # sleep が回収しない孤児のゾンビを tini で回収する。生きた残骸は entrypoint.sh が止める。
    init: true
    # デーモンの再起動では depends_on が効かず、前回の install/ で動く。
    # down -v の後は docker compose up -d を通してから再起動すること。
    restart: unless-stopped
    network_mode: host
    # SHM を共有し、UDP のみで配信したときの Pi 4 の飽和と TF 遅延を防ぐ。
    ipc: host
    # SHM は 0644。ホストと uid が違うと Fast DDS 2.6 は UDP にも落ちず通信が止まる。
    user: "1000:1000"
    environment:
      HOME: /tmp
      ROS_HOME: /tmp/ros
      ROS_LOG_DIR: /tmp/ros/log
      ROS_DOMAIN_ID: ${ROS_DOMAIN_ID:-90}
      ROS_LOCALHOST_ONLY: "0"
      RMW_IMPLEMENTATION: rmw_fastrtps_cpp
      # 届かない wlan0 のロケータ広告によるディスカバリの揺れを防ぐ。
      FASTRTPS_DEFAULT_PROFILES_FILE: /etc/fastdds/udp_whitelist.xml
      # raspicat 側と揃えないと navigation / mapping の /scan 生成が黙って空になる。
      LIDAR: ${LIDAR:-mid360}
      LIDAR_DRIVER: ${LIDAR_DRIVER:-true}
    volumes:
      - ./fastdds_udp_whitelist.xml:/etc/fastdds/udp_whitelist.xml:ro
      # cgroup 規則で後挿しのマイナー番号も許可する。joy_node は raspicat 側。
      - /dev/input:/dev/input:ro
      # install/ の symlink が切れないよう workspace-build と同じ src/ を見せる。
      - ../../src:/opt/ros_ws/src
      - ../../daifuku_autonomous.repos:/opt/ros_ws/daifuku_autonomous.repos:ro
      - autonomous-build:/opt/ros_ws/build
      - autonomous-install:/opt/ros_ws/install
      - autonomous-log:/opt/ros_ws/log
    device_cgroup_rules:
      - "c 13:* r"

  # navigation の再起動で /odom と LiDAR の初期化を巻き込まないよう機体を分離する。
  # ドライバが finalized になると LiDAR・EKF ごと上がり直す。
  # /scan 生成は navigation / mapping 側。raspimouse はホストの rtmouse が必要。
  raspicat:
    image: daifuku-autonomous:humble
    container_name: daifuku-raspicat
    depends_on:
      workspace-build:
        condition: service_completed_successfully
    stdin_open: true
    tty: true
    # ドライバ側の command を重ね忘れたら、未選択のまま起動せず落とす。
    command:
      - /bin/sh
      - -c
      - >-
        echo 'compose.common.yaml を直接起動しないこと。
        compose.rt.yaml か compose.original.yaml を使う (.env の COMPOSE_FILE)。' >&2;
        exit 1
    # ros2 launch が回収しない孤児のゾンビを tini で回収する。
    init: true
    # install/ が名前付きボリュームに残るので、単独で先に上がっても前回の成果物が見える。
    restart: unless-stopped
    network_mode: host
    ipc: host
    user: "1000:1000"
    # root:input 0660 の event* を開くためホストの input GID が必要（違えば INPUT_GID）。
    # /dev と cgroup 規則だけでは権限が足りず、/joy が黙って出なくなる。
    group_add:
      - "${INPUT_GID:-995}"
    environment:
      HOME: /tmp
      ROS_HOME: /tmp/ros
      ROS_LOG_DIR: /tmp/ros/log
      ROS_DOMAIN_ID: ${ROS_DOMAIN_ID:-90}
      ROS_LOCALHOST_ONLY: "0"
      RMW_IMPLEMENTATION: rmw_fastrtps_cpp
      FASTRTPS_DEFAULT_PROFILES_FILE: /etc/fastdds/udp_whitelist.xml
      # ドライバの配線と EKF の起動を robot_bringup が同じ値で切り替える。
      USE_MID360_IMU: ${USE_MID360_IMU:-true}
    volumes:
      - ./fastdds_udp_whitelist.xml:/etc/fastdds/udp_whitelist.xml:ro
      - ../../src:/opt/ros_ws/src
      - ../../daifuku_autonomous.repos:/opt/ros_ws/daifuku_autonomous.repos:ro
      - autonomous-build:/opt/ros_ws/build
      - autonomous-install:/opt/ros_ws/install
      - autonomous-log:/opt/ros_ws/log
      # rtmouse のメジャー番号は insmod ごとに変わるため /dev 全体を渡す。
      # 固定の devices / cgroup 規則では再起動後にモータ・エンコーダを掴めなくなる。
      # char デバイスはほぼ privileged 相当。狭めるなら rtmouse 側で番号を固定すること。
      - /dev:/dev
    device_cgroup_rules:
      - "c *:* rwm"

volumes:
  autonomous-build:
  autonomous-install:
  autonomous-log:
