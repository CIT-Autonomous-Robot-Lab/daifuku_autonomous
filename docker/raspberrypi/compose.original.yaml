# 自前の本体ドライバ (driver:=original) で走らせるときの上書き。compose.yaml に
# 重ねて使う。
#
#   docker compose -f docker/raspberrypi/compose.yaml \
#                  -f docker/raspberrypi/compose.original.yaml up -d
#
# Pi 5 では**必須**（rtmouse が動かないので公式実装を選べない）。Pi 4 では任意で、
# 重ねなければ既定の driver:=raspimouse（公式実装 + rtmouse）になる。Pi 4 で
# こちらを使うときは rtmouse を載せないこと（ノードが起動時に拒否する）。経緯と
# 検証項目は docs/setup/raspberry-pi-4.md と raspberry-pi-5.md。
#
# 変えるのは raspicat サービスだけ。ナビゲーション側 (ros2 サービス) は機種にも
# ドライバにも依存しない。
#
# ステップクロックは /sys/class/pwm から出す。カーネルの PWM サブシステムには
# キャラクタデバイスの API が無いので、sysfs を通すしかない。Docker は既定で
# /sys を read-only で見せるため、必要な 2 つを rw で重ねる。
#
#   * /sys/class/pwm    … pwmchip* と export/unexport
#   * /sys/devices      … /sys/class/pwm/pwmchipN は実体へのシンボリックリンクで、
#                         こちらが無いとリンクが宙に浮く
#
# /sys/devices を丸ごと rw で渡すのは広い。ただし compose.yaml は既にモータ制御の
# ために /dev を丸ごと渡し `device_cgroup_rules: c *:* rwm` を付けており、キャラクタ
# デバイスについてはほぼ privileged 相当になっている (compose.yaml のコメント)。
# ここもその延長で、狭めるなら pwmchip の実体パスだけを名指しでマウントする
# (機種ごとにアドレスが変わるので書き換えが要る)。
#
# コンテナは user: "1000:1000" で動くので、ホスト側で sysfs と /dev の所有権を
# 渡しておく必要がある。tools/image/udev/99-daifuku-raspicat.rules を参照。

services:
  raspicat:
    command:
      - /ros_entrypoint.sh
      - ros2
      - launch
      - autonomous_nav
      - robot_bringup.launch.py
      - driver:=original
    # Compose はマウント先をキーにして重ねるので、ここは追加分だけでよい
    # (compose.yaml 側の /dev などはそのまま残る)。
    volumes:
      - /sys/class/pwm:/sys/class/pwm
      - /sys/devices:/sys/devices
