# 本体ドライバに自前実装 (driver:=original、src/raspicat_driver) を使う構成。
# **Pi 5 では必須** (rtmouse が動かない)。Pi 4 で使うなら rtmouse を載せないこと
# (ノードが起動時に拒否する)。docs/setup/raspberry-pi-{4,5}.md。
#
# **単体では完結せず、compose.common.yaml と 2 つ重ねて渡す。common が先**
# (Compose 2.40 は include した側のサービスの上書きを
# `services.raspicat conflicts with imported resource` で拒む)。選ぶのは .env の
# COMPOSE_FILE。project 名は common に無いのでここに要り、rt と同じ名前にして
# あるので行き来してもビルドキャッシュは同じものが見える。
#
# 変えるのは raspicat サービスだけ (ros2 側はドライバに依存しない)。
#
# ステップクロックは /sys/class/pwm から出す (PWM サブシステムに char デバイスの
# API が無い)。Docker は /sys を read-only で見せるので、pwmchip 本体と、その
# symlink の実体がある /sys/devices の 2 つを rw で重ねる。**マウントと所有権
# (tools/image/udev/99-daifuku-raspicat.rules) だけでは足りず、AppArmor の
# docker-default が /sys/** への書き込みを拒む** — 所有者が合っていても export が
# EACCES になり、deny は監査ログを出さないので dmesg にも残らない。security_opt で
# 外してある。範囲は common の /dev 丸渡しと同じで、これ以上広げてはいない。
name: daifuku-autonomous

services:
  raspicat:
    command:
      - /ros_entrypoint.sh
      - ros2
      - launch
      - daifuku_bringup
      - robot_bringup.launch.py
      - driver:=original
      - lidar:=${LIDAR:-mid360}
    security_opt:
      - apparmor=unconfined
    # Compose はマウント先をキーにして重ねるので、ここは追加分だけでよい
    # (compose.common.yaml 側の /dev などはそのまま残る)。
    volumes:
      - /sys/class/pwm:/sys/class/pwm
      - /sys/devices:/sys/devices
