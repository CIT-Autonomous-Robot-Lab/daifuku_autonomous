services:
  ros2:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: daifuku-autonomous:humble
    container_name: daifuku-autonomous
    stdin_open: true
    tty: true
    command: ["sleep", "infinity"]
    network_mode: host
    environment:
      DISPLAY: ${DISPLAY:-host.docker.internal:0.0}
      LIBGL_ALWAYS_SOFTWARE: ${LIBGL_ALWAYS_SOFTWARE:-1}
      QT_X11_NO_MITSHM: "1"
      ROS_DOMAIN_ID: ${ROS_DOMAIN_ID:-0}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ../src/autonomous_nav:/opt/ros_ws/src/autonomous_nav
