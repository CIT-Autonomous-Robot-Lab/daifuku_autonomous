services:
  ros2:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        BUILD_JOBS: ${BUILD_JOBS:-2}
    image: daifuku-autonomous:humble
    container_name: daifuku-autonomous
    stdin_open: true
    tty: true
    command: ["sleep", "infinity"]
    network_mode: host
    # Share /dev/shm with the host so Fast DDS SHM works between the
    # container and the native driver processes. UDP-only fan-out to ~20
    # participants saturated the Pi4 kernel (57% sys, load 24) and lagged
    # TF by 20+ s.
    ipc: host
    # Run as the same uid as the host ROS processes (ubuntu, 1000). Fast DDS
    # creates SHM segments with 0644, so mixed root/non-root participants
    # cannot open each other's ports and host->container topics silently
    # stop (no UDP fallback in Fast DDS 2.6).
    user: "1000:1000"
    environment:
      HOME: /tmp
      ROS_HOME: /tmp/ros
      ROS_LOG_DIR: /tmp/ros/log
      ROS_DOMAIN_ID: ${ROS_DOMAIN_ID:-90}
      ROS_LOCALHOST_ONLY: "0"
      RMW_IMPLEMENTATION: rmw_fastrtps_cpp
      # Restrict DDS to lo/eth0 so wlan0 locators are never advertised
      # (unreachable locators made discovery flap under load).
      FASTRTPS_DEFAULT_PROFILES_FILE: /etc/fastdds/udp_whitelist.xml
    volumes:
      - ./fastdds_udp_whitelist.xml:/etc/fastdds/udp_whitelist.xml:ro
      # joy_node uses evdev devices. The cgroup rule also permits hot-plugged
      # controllers whose minor number was not present at container creation.
      - /dev/input:/dev/input:ro
      - ../src/autonomous_nav:/opt/ros_ws/install/share/autonomous_nav
      # ament_cargo does not install package.xml's <install>launch</install>.
      # Keep the VI Nav2 launch available to the already-built Pi image.
      - ../src/value_iteration3/vi_ros2/vi_global_planner/launch:/opt/ros_ws/install/share/vi_global_planner/launch:ro
      - ../src/value_iteration3/vi_ros2/vi_planner/launch:/opt/ros_ws/install/share/vi_planner/launch:ro
    device_cgroup_rules:
      - "c 13:* r"

  # Raspberry Pi Cat 本体ドライバ (raspimouse + robot_state_publisher)。
  # 従来はホストの ~/raspicat2 ワークスペースから直接起動していたものを、
  # ナビゲーションと同じイメージ・同じ compose に取り込んだもの。
  #
  # ナビゲーションとは別サービスにしてある。ros2 サービスだけを
  # `docker compose restart ros2` で入れ替えてもドライバは生き続けるため、
  # odom の累積が落ちない/取り違える事故が起きにくい。
  #
  # 前提: rtmouse カーネルモジュールがホストで insmod 済みであること
  # (コンテナからは insmod できない。raspicat_setup_scripts が導入する)。
  raspicat:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        BUILD_JOBS: ${BUILD_JOBS:-2}
    image: daifuku-autonomous:humble
    container_name: daifuku-raspicat
    stdin_open: true
    tty: true
    command:
      - /ros_entrypoint.sh
      - ros2
      - launch
      - autonomous_nav
      - robot_bringup.launch.py
    restart: unless-stopped
    network_mode: host
    ipc: host
    user: "1000:1000"
    environment:
      HOME: /tmp
      ROS_HOME: /tmp/ros
      ROS_LOG_DIR: /tmp/ros/log
      ROS_DOMAIN_ID: ${ROS_DOMAIN_ID:-90}
      ROS_LOCALHOST_ONLY: "0"
      RMW_IMPLEMENTATION: rmw_fastrtps_cpp
      FASTRTPS_DEFAULT_PROFILES_FILE: /etc/fastdds/udp_whitelist.xml
    volumes:
      - ./fastdds_udp_whitelist.xml:/etc/fastdds/udp_whitelist.xml:ro
      - ../src/autonomous_nav:/opt/ros_ws/install/share/autonomous_nav
      # rtmouse は out-of-tree モジュールで、char デバイスのメジャー番号を
      # insmod のたびに動的に取る (実測 497-506)。したがって `devices:` や
      # メジャー固定の device_cgroup_rules は、モジュール再読込やリブートで
      # 古い番号を焼き付けたまま静かにモータ/エンコーダを掴めなくなる。
      # use_pulse_counters: true では、それが「odom がまったく動かない」という
      # 別のバグの顔をして出るので特にたちが悪い。
      # そこで /dev を丸ごと渡し、char デバイスを広く許可している。
      # これは character device に関してはほぼ privileged 相当。狭める場合は
      # rtmouse 側でメジャー番号を固定し、ここに列挙する必要がある
      # (人手で同期を保つコストと引き換え)。
      - /dev:/dev
    device_cgroup_rules:
      - "c *:* rwm"
