services:
  raspicat-dev:
    build:
      context: ..
      dockerfile: docker_dev/Dockerfile
    image: daifuku-raspicat-dev:humble
    container_name: daifuku-raspicat-dev
    network_mode: host
    stdin_open: true
    tty: true
    command: ["sleep", "infinity"]
    cap_add:
      - SYS_PTRACE
    security_opt:
      - seccomp:unconfined
    environment:
      DISPLAY: ${DISPLAY:-host.docker.internal:400.0}
      WAYLAND_DISPLAY: ${WAYLAND_DISPLAY:-}
      XDG_RUNTIME_DIR: ${XDG_RUNTIME_DIR:-}
      LIBGL_ALWAYS_SOFTWARE: ${LIBGL_ALWAYS_SOFTWARE:-1}
      QT_X11_NO_MITSHM: "1"
      ROS_DOMAIN_ID: ${ROS_DOMAIN_ID:-90}
      ROS_LOCALHOST_ONLY: ${ROS_LOCALHOST_ONLY:-0}
      RMW_IMPLEMENTATION: ${RMW_IMPLEMENTATION:-rmw_fastrtps_cpp}
      # Native ROS 2 nodes on the Raspberry Pi must not be mistaken for
      # same-host peers through Fast DDS shared memory.
      FASTDDS_BUILTIN_TRANSPORTS: ${FASTDDS_BUILTIN_TRANSPORTS:-UDPv4}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ..:/workspaces/daifuku_autonomous
      - autonomous-build:/workspaces/daifuku_autonomous/build
      - autonomous-install:/workspaces/daifuku_autonomous/install
      - autonomous-log:/workspaces/daifuku_autonomous/log

volumes:
  autonomous-build:
  autonomous-install:
  autonomous-log:
