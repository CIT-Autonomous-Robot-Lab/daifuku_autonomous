[project]
name = "daifuku-sim"
version = "0.1.0"
description = "usim VTC mapping and navigation harness for daifuku_stack"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pillow>=10.0",
    "pyyaml>=6.0",
    "usim==0.1.0",
    "usim-gazebo==0.1.0",
]

[project.scripts]
daifuku-vtc = "daifuku_sim.vtc.run_vtc:main"
daifuku-vtc-video = "daifuku_sim.vtc.render_video:main"
[tool.uv.sources]
usim = { path = "../../usim", editable = true }
usim-gazebo = { path = "../../usim/packages/gazebo", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/daifuku_sim"]
