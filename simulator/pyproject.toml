[project]
name = "daifuku-sim"
version = "0.1.0"
description = "Simulation scenarios for daifuku using usim"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
    "filelock>=3.16",
    "pillow>=10.0",
    "pyyaml>=6.0",
    "usim==0.1.0",
    "usim-gazebo==0.1.0",
]

[dependency-groups]
test = ["pytest>=8.0", "numpy==1.26.4", "usd-core==25.5.1"]

[project.scripts]
daifuku-sim = "daifuku_sim.cli:main"
daifuku-vtc = "daifuku_sim.vtc.cli:main"
daifuku-vtc-video = "daifuku_sim.vtc.cli:video_main"
[tool.uv.sources]
usim = { git = "https://github.com/NOPLAB/usim.git", rev = "9b233a9406b6c83db08538e016e3115cc3b6805b" }
usim-gazebo = { git = "https://github.com/NOPLAB/usim.git", rev = "9b233a9406b6c83db08538e016e3115cc3b6805b", subdirectory = "packages/gazebo" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/daifuku_sim"]
