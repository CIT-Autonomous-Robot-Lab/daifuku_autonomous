# ゲームパッド (XInput 互換) での手動走行。robot_bringup.launch.py が
# joy_teleop_params_file で joy_node と joy_teleop の両方へ渡す
# (joy:=false なら立てない)。1 つのファイルに 2 ノード分入っているのは、
# 節の名前でノードを選り分けるので混ざらないため。
#
# 「既定」= joy_node は upstream joy パッケージ、joy_teleop は
# src/joy_teleop.py の declare_parameter の値。
#
# ボタンと軸の番号は **XInput (X モード)** のときのもの。DirectInput のパッドや、
# モード切り替えを持つ機種を D 側にしたものは総入れ替えになる。左スティックと
# 十字キーを入れ替えるモードを持つ機種もある。合わなければ
# `ros2 topic echo /joy` で押しながら確かめて直すこと
# (番号違いは**エラーにならず、ただ効かない**)。
#
# 速度域と操作の意味は ../../../../docs/usage/joystick.md。

joy_node:
  ros__parameters:
    device_id: 0            # 既定 0: /dev/input の何番目のゲームパッドか。複数挿すときだけ変える
    # 既定 0.05: **0 にしてある**。ここで切ると軸の値が切った分だけ引き伸ばされて
    # 届くので、joy_teleop の deadzone と二重に効いて実際の不感帯が表の値とずれる。
    # 不感帯は joy_teleop 側だけに持たせる。
    deadzone: 0.0
    # 既定 20.0 [Hz]: 変化が無くても再送する周期。**0 にしないこと**。joy_node は
    # 既定では状態が変わったときしか出さないので、スティックを一定の角度で
    # 保持すると /joy が止まり、joy_timeout に引っかかって機体が止まる。
    autorepeat_rate: 20.0
    sticky_buttons: false   # 既定 false: 押すたびに ON/OFF が入れ替わる操作にするか。長押し判定が壊れるので false のまま

joy_teleop:
  ros__parameters:
    axis_linear: 1          # 既定 1: 前後に使う軸 (左スティックの上下)。上が前進
    axis_angular: 0         # 既定 0: 旋回に使う軸 (左スティックの左右)。左が左旋回
    deadzone: 0.15          # 既定 同左: この傾き以下は 0。超えたところで min_speed に飛ぶ

    linear_min_speed: 0.15  # 既定 同左 [m/s]: 不感帯を出た直後の速さ。これ未満は唸るだけで進まない
    linear_max_speed: 0.35  # 既定 同左 [m/s]: 目一杯倒したときの速さ
    linear_boost_speed: 0.5 # 既定 同左 [m/s]: button_boost を押しているときの上限
    angular_min_speed: 0.3  # 既定 同左 [rad/s]: 旋回の下限。並進と同じ考え方
    angular_max_speed: 1.0  # 既定 同左 [rad/s]: 旋回の上限
    angular_boost_speed: 1.5 # 既定 同左 [rad/s]: ブースト時の旋回の上限

    button_toggle: 7        # 既定 7: START。hold_seconds 長押しで teleop の入/切
    button_waypoints: 6     # 既定 6: BACK。START と同時に hold_seconds でウェイポイント巡回を開始
    button_boost: 5         # 既定 5: RB。押しているあいだだけ上限が boost 側になる
    hold_seconds: 3.0       # 既定 同左 [s]: 長押しと判定するまでの時間

    publish_rate: 20.0      # 既定 同左 [Hz]: /cmd_vel_teleop を出す周期。twist_mux の timeout 0.5 s より十分速く
    joy_timeout: 0.5        # 既定 同左 [s]: /joy がこれだけ途切れたら受信断とみなしてゼロを出す
    stop_tail: 1.0          # 既定 同左 [s]: teleop を切ったあとゼロを出し続ける時間。黙るだけだとドライバが最後の速度を保持する
    cancel_window: 2.0      # 既定 同左 [s]: teleop に入ったあと取り消しを出し続ける時間。1 回では waypoint_follower が次の点へ出し直す分を拾えない
    start_enabled: false    # 既定 false: 起動直後から teleop 入にするか。true にすると挿しただけで自律側を塞ぐ

    # 巡回する経路。空なら share/daifuku_stack/waypoints/waypoints_tsudanuma.yaml。
    # **地図と対で選ぶこと**。map_19f で tsudanuma の経路を投げると全点が地図の
    # 外に出て、1 点ごとに失敗しながら最後まで進む (stop_on_failure: false のため)。
    waypoints_file: ""

    follow_waypoints_action: "follow_waypoints"  # 既定 同左: nav2_waypoint_follower のアクション名
    navigate_to_pose_action: "navigate_to_pose"  # 既定 同左: teleop に入るときに取り消す単発ゴールのほう
