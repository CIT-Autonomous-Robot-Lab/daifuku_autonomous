# map_tsudanuma.yaml (5888x4000 @0.05m = 294.4m x 200m) 用の上書き。
# 「断片」= config/nav2/vi_planner.yaml の値 (= ノードの既定)。
#
#   ros2 launch daifuku_stack navigation.launch.py \
#       map:=<share>/maps/map_tsudanuma.yaml \
#       overrides:=map_tsudanuma planner:=vi local_planner:=vi
#
# 0.05m のまま解くと 14.1 億状態 = 密ソルバで 79GB を確保して起動と同時に死ぬ。
# プランナ内部だけ粗くし (map_scale)、密な states を確保しない compact で解くことで通す。
# 実測値・導出・既知の制約 (行動集合を変えるので value_iteration3 は ec2579d 以降が要る、
# 全域スライスが重い、pi4_sim では BT がリカバリして ABORT する) は ../README.md を参照。
#
# **overrides は置き換えなので、既定の map_19f はこのとき外れる** = emcl2 は断片の値で
# 走る。この地図は 68.2% が未観測で占有セルが 0.4% しかなく、19F と同じ alpha 崩壊が
# 起きる余地がある。起きたら map_19f.yaml の emcl2 ブロックをここへ写すこと。**未検証**。
#
# 確定出力 (sink 648MB) は **RAM** に置く。Pi 5 (8GB) は走行中でも空きが 5.6GB あり、
# 断片の compact_ram_limit_mb (4096MB) に収まるので自動退避も起きない。**4GB 機で使うなら
# 両ノードに compact_sink_dir を書き戻すこと** (広域側は vi_global_planner_sink)。
# 退避先は tmpfs でないこと (`findmnt -no FSTYPE <dir>`)。
#
# 2026-08-01 実測 (Pi4 相当 = 0.6 コア枠 / メモリ 3GB, VI_THREADS=3、BT を外した最小構成):
#   ソルバ単体 (bench_map): scale 3 保守 2706s / anon 2148MB、scale 5 楽観 51.9s
#   vi_planner ノード: solve + ロールアウト 87-89s / 398 姿勢 / SUCCEEDED
#                      ピーク RSS 1.60GB、sink 648MB、oom_kill 0
#   ▲ この RSS はディスク退避していた頃のもの。RAM 化した今は**未計測**。

emcl2:
  ros__parameters:
    alpha_threshold: 0.2                # 断片 0.5 (EMCL2 既定 0.5): alpha が 0.0-0.4 に張り付くため
    expansion_radius_orientation: 0.05  # 断片 0.2 (EMCL2 既定 0.2): リセット時の姿勢の飛びを抑える
    sensor_reset: false                 # 断片 true (EMCL2 既定 false): 貫通粒子の引き戻しを止める

vi_global_planner:
  ros__parameters:
    solver: "frontier2d_sparse_compact"  # 断片も同じ値: states を確保しない。この地図では必須なので明示する
    # 以下 4 つ (map_scale / downsample_policy / action_forward_m / goal_margin_radius) は
    # セットで効く。1 つでも欠けると波がゴール近傍で止まり、到達列 1 で「収束」する。
    # scale 6 は楽観でも通路のセル幅が足りず解けない。
    map_scale: 5                         # 断片 1: 内部だけ 0.25m/cell (5650 万状態)
    downsample_policy: "optimistic"      # 既定 conservative (断片は未設定): 保守側だと通路のセル幅が死ぬ
    action_forward_m: [0.5, -0.3333, 0.0, 0.3333, 0.0, 0.3333]  # 断片の 5/3 倍 (セル比例)
    goal_margin_radius: 0.5              # 断片 0.3: ゴールセル数を 7 に保つ (セル比例)
    safety_radius_penalty: 1             # 断片 30: 30 だと貪欲ロールアウトが降下できない
    max_rollout_steps: 100000            # 断片 10000: 広域では遠い start から届かない

# local_planner:=vi (vi_planner 1 ノード構成) 用。解像度まわりと safety_radius_penalty は
# vi_global_planner と同じ値にしてある。片方だけ変えると同じ地図なのに 2 構成で別の経路が
# 出て比較にならない。狭域追従が密な states をどう用立てるかは ../README.md と
# vi_planner/src/core/compact.rs 冒頭。
vi_planner:
  ros__parameters:
    solver: "frontier2d_sparse_compact"  # 断片も同じ値: 密だと 3.17GB で OOM。この地図では必須なので明示する
    map_scale: 5                         # 既定 1 (断片は未設定): 内部だけ 0.25m/cell (5650 万状態)
    downsample_policy: "optimistic"      # 既定 conservative (断片は未設定): 保守側だと通路のセル幅が死ぬ
    action_forward_m: [0.5, -0.3333, 0.0, 0.3333, 0.0, 0.3333]  # 断片の 5/3 倍 (セル比例)
    goal_margin_radius: 0.5              # 断片 0.3: ゴールセル数を 7 に保つ (セル比例)
    safety_radius_penalty: 1             # 断片 30: 30 だと貪欲ロールアウトが降下できない
    max_rollout_steps: 100000            # 断片 10000: 広域では遠い start から届かない
    # global_sweep と budget/idle は断片のまま (compact でもタイル修復として効く)。
    # **走行中に "global sweep done in" は出ない**のが設計どおりで、動いているかは
    # 2 秒ごとの "tile repair running for" のほうで見る (../README.md)。

# ── ここで上書きしていないもの ────────────────────────────────────────────
# いずれも**未検証**。次も上書きが要るかもしれない。
#   emcl2 の 3 つ (alpha_threshold / expansion_radius_orientation / sensor_reset)
#     … alpha 崩壊が起きたら map_19f.yaml から写す (ヘッダ)。
#   costmaps.*.track_unknown_space / vi の unknown_as_obstacle … 未観測を通行可にするか。
#     今はどちらも「未観測 = 通れない」= 舗装路のみ通行可。
#   compact_sink_dir … 断片のまま ("" = RAM。ヘッダ)。**指定するとそちらが無条件に勝ち、
#     下の compact_ram_limit_mb は一切読まれない**。書くときは速い実ディスクにすること
#     (コンテナの /tmp は書き込み層 = SD カードで、追従が読むたび制御周期に響く)。
#   compact_ram_limit_mb … 断片が両ノードとも 4096MB。**この地図で効いている唯一の条件が
#     「この値 > sink 648MB」**で、4096 である必要はない。ノード既定の 512MB まで下げると
#     黙って /tmp/vi_*_sink = SD カードへ落ちる。
#   waypoint_prefetch … 断片が false へ戻った (2026-08-04 の固まりの容疑者の 1 つ)。
#     true にすると先読み中は価値関数が 2 つ = sink も 2 つで、648MB x2 = 1.3GB が
#     匿名メモリに居座る。Pi 5 なら通るが**未計測**。4GB 機では足さないこと。
#   publish_value_function / value_publish_interval_ms … 断片の true / 500ms のまま。
#     **この地図では全域スライス 1 枚 (94 万セル) が重い**。掃きスレッドがそれをロックを
#     握ったまま 2 秒ごとに作るので、走行中に /cmd_vel_mux が 2 秒おきに途切れる恐れが
#     ある。2026-08-04 の実機はまさにこの止まり方だったが、犯人の切り分けは未了 —
#     再発したら value_publish_interval_ms: 0 をここへ足すのが戻し方 (../README.md)。
