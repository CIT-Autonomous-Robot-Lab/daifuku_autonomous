# map_19f.yaml (19F、915x577 @0.05m = 45.8m x 28.9m) 用の上書き。
# 「断片」= config/localization/emcl2.yaml と config/nav2/vi_planner.yaml の値。
#
#   ros2 launch daifuku_stack navigation.launch.py    # map も overrides も既定
#
# **overrides の既定値**。別の地図では `overrides:=map_tsudanuma` のように
# **置き換わる** (足されない) ので、19F 用の調整は自動的に外れる。
#
# ここに置くのは「19F の地図だからこの値」というものだけ。機体固有 (base_frame_id
# など) や Pi4 固有 (default_server_timeout など) は地図が変わっても要るので断片側。

# ── emcl2 ──────────────────────────────────────────────────────────────────
# 2026-07-24 の実機計測: 有効ビームの 28% が地図の壁を貫通し、非貫通率 (alpha) が
# 0.0-0.4 に張り付いた。断片側の 0.5 では膨張リセットとセンサリセットが毎スキャン
# 発動し、推定姿勢がその場で回転する。根因は地図と実環境の不整合なので、これは
# **地図を取り直すまでの対症療法**。作り直したら 3 つとも消すこと。
#
# emcl2 は params_file を通らない。navigation.launch.py が emcl2 用の合成を別に
# 行うことで効いている (../README.md)。値を足したら、起動ログの
# "params: composed emcl2 ..." 行でパスが差し替わったことを確認すること。
emcl2:
  ros__parameters:
    alpha_threshold: 0.2                # 断片 0.5 (EMCL2 既定 0.5): alpha が 0.0-0.4 に張り付くため
    expansion_radius_orientation: 0.05  # 断片 0.2 (EMCL2 既定 0.2): リセット時の姿勢の飛びを抑える
    sensor_reset: false                 # 断片 true (EMCL2 既定 false): 貫通粒子の引き戻しを止める

# ── 価値反復プランナ ────────────────────────────────────────────────────────
# map_scale は**プランナ内部だけ**の解像度で、/map・コストマップ・emcl2 は 0.05m の
# まま。2 で 458x289 @0.10m = 794 万状態 (scale 1 の 3168 万の 1/4)。代償は 0.10m/cell
# の粗さと、保守的プーリングで通路が片側最大 0.05m 細ること。
#
# **ここで 2 にしている理由は solve を軽くするため**で、断片が compact になった今は
# 必須ではない (2026-07-29 の実機は compact scale 1 で solve 29.25s / RSS 833MB で
# 通っている)。状態数が 1/4 になるぶん solve も伝播も速い。
#
# 密に戻すなら**この scale 2 とセット**。密の常駐は 80 B/state — states 56 +
# sweep_orders 24 — で、scale 1 なら 2.5GB、**2 なら実測 654.8MB** (states 444.7 +
# sweep_orders 210.1)。4GB の Pi4 で他のノードと同居できるのは後者だけ。上限を見るのは
# ノード側の dense_limit_mb (断片で 2048MB にしてある)。かつてここには「scale > 1 は
# 密ソルバでは通らない」と書いてあったが前提が逆で、scale は密を**載せるための**手段。
#
# **未検証** — この地図・この scale での solve 時間と経路、および狭域 → 広域の伝播に
# かかる実時間は測っていない (密なら host 実測 5.23M cells/s から Pi4 で 1 掃き
# 8〜11 秒の見込み。compact のタイル修復は見積もりも無い)。実測値は起動ログの
# "global sweep done in" に出る。
#
# map_tsudanuma の scale 5 は downsample_policy / action_forward_m /
# goal_margin_radius とセットだが、2 では 1 手 3 セル・ゴール半径 3 セル・
# safety_radius 2 セルが残るので断片のまま。両ノードに同じ map_scale を置くのは、
# 片方だけだと同じ地図なのに 2 構成で別の経路が出るため。
vi_planner:
  ros__parameters:
    map_scale: 2                       # 既定 1 (断片は未設定): 内部だけ 0.10m/cell (794 万状態)。solve を軽くするため

vi_global_planner:
  ros__parameters:
    map_scale: 2                       # 断片 1: 同上 (vi_planner と揃える)

# ── ここで上書きしていないもの ────────────────────────────────────────────
# この地図では断片 (= ほぼノード既定) のままで足りている。上書きが要るとしたら
# 次の順で疑うこと。
#   emcl2.range_threshold / laser_likelihood_max_dist … 地図の壁の厚みが実物と
#     違うとき。今の 19F は貫通が多いので alpha_threshold 側で凌いでいる。
#   costmaps.*.inflation_radius … 通路幅が足りず経路が出ないとき。ただし外接円
#     0.408m を下回らせないこと (../nav2/costmaps.yaml)。
#   vi_planner.safety_radius_penalty … 通路が細くて貪欲ロールアウトが固着する
#     とき。map_tsudanuma では 1 まで下げている。
#   vi_planner/vi_global_planner.compact_sink_dir … sink を RAM から追い出すとき。
#     断片の compact_ram_limit_mb (2048MB) による自動退避先は /tmp/vi_*_sink (コンテナの
#     書き込み層 = SD カード) なので、逃がすなら速い場所を明示するほうがよい。vi_planner の
#     追従はパッチ置き直しのたびに sink を読むので、遅い先だと制御周期に響く。
#     19F は scale 2 で sink 0.095GB なので、そもそも退避しない。
#   vi_planner/vi_global_planner.downsample_policy … 通路のセル幅が足りず波が
#     ゴール近傍で止まるとき。map_scale >= 4 では optimistic が必須だが、2 では
#     保守側でも通路が片側 0.05m しか細らないので既定のまま。
#   vi_planner/vi_global_planner.cost_drawing_threshold … value_function の色が
#     潰れて読めないとき。**表示専用**なので経路には影響しない。断片の 60 のままだと
#     19F では到達可能セルの 66% が飽和する (2026-07-29 実測、導出は ../README.md)。
#     遠くまで階調が要るなら 180 (p90-p99 間) に上げること。
