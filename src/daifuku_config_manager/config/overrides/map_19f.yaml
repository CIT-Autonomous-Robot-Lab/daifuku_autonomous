# map_19f.yaml (19F、915x577 @0.05m = 45.8m x 28.9m) 用の上書き。**overrides の既定値**。
# 「断片」= 重ねる先の設定ファイルの値で、この地図では
# daifuku_bringup/config/sensors/mid360_scan.yaml、
# daifuku_stack/config/localization/emcl2.yaml と config/nav2/vi_planner.yaml。
#
#   tools/site.sh map_19f                             # config/site (既定)。機体も立て直す
#   ros2 launch daifuku_stack navigation.launch.py    # map も overrides も既定
#
# **1 段目はパッケージ名。** 各 launch は自分の名前の部分木しか読まない
# (daifuku_bringup: は機体側 = docker compose up で常駐、daifuku_stack: は人が立てる
# navigation / mapping)。知らない名前を書くと起動時に落ちる。
#
# 別の地図では `overrides:=map_tsudanuma` のように**置き換わる** (足されない) ので、
# 19F 用の調整は自動的に外れる。ここに置くのは「19F の地図だからこの値」というものだけ
# で、機体固有 (base_frame_id) や Pi4 固有 (default_server_timeout) は断片側。
#
# 値の由来は daifuku_stack/config/README.md。

# ── 機体側 (docker compose up で常駐する robot_bringup.launch.py) ─────────────
# **ここを変えたら `docker compose restart raspicat` が要る。** navigation を立て直す
# だけでは変わらない (読むのは raspicat サービスなので)。
daifuku_bringup:
  # ── スキャンの切り出し ────────────────────────────────────────────────────
  # 3 つとも断片と同じ値だが、**帯も距離も場所で変わる**ので地図の側から見えるように
  # 明示する。min は搭載高ちょうど、max はその +0.225m で、屋内の腰高だけを採る形。
  # 片方だけ動かすと帯が潰れて (min >= max) スキャンが空になるので、対で見ること。
  # range_max は**この地図では効かない** (対角 54.1m がセンサ上限の内側)。仰角フィルタも
  # 0 度 = 断片のままなので、tsudanuma のような max_height との組の制約もここには無い。
  pointcloud_to_laserscan:
    ros__parameters:
      min_height: 0.275               # 断片も同じ値: 搭載高 (2026-08-03 実測)。下げると床が載る
      max_height: 0.50                # 断片も同じ値: 天井と高所の反射を捨てる
      range_max: 70.0                 # 断片も同じ値: センサ上限のまま。地図が 45.8x28.9m なので届く前に壁がある

# ── 自律移動側 (人が立てる navigation / mapping) ──────────────────────────────
daifuku_stack:
  # ── emcl2 ────────────────────────────────────────────────────────────────
  # 有効ビームの 28% が地図の壁を貫通し、断片の 0.5 では膨張リセットとセンサリセットが
  # 毎スキャン発動して推定姿勢がその場で回る。根因は地図と実環境の不整合なので、これは
  # **地図を取り直すまでの対症療法** — 作り直したら 3 つとも消すこと。
  emcl2:
    ros__parameters:
      alpha_threshold: 0.2                # 断片 0.5 (EMCL2 既定 0.5): alpha が 0.0-0.4 に張り付くため
      expansion_radius_orientation: 0.05  # 断片 0.2 (EMCL2 既定 0.2): リセット時の姿勢の飛びを抑える
      sensor_reset: false                 # 断片 true (EMCL2 既定 false): 貫通粒子の引き戻しを止める

  # ── 価値反復プランナ ──────────────────────────────────────────────────────
  # map_scale は**プランナ内部だけ**の解像度で、/map・コストマップ・emcl2 は 0.05m のまま。
  # 断片が compact になった今は必須ではないが、状態数が 1/4 になるぶん solve も伝播も速い。
  # **密に戻すならこの scale 2 とセット** (scale 1 は 2.5GB、2 は実測 655MB)。
  # 両ノードに同じ値を置くのは、片方だけだと同じ地図なのに 2 構成で別の経路が出るため。
  # 代償・見積もり・先読みとの兼ね合いは daifuku_stack/config/README.md。**未検証** —
  # この地図・この scale での solve 時間と経路、狭域 → 広域の伝播にかかる実時間は
  # 測っていない。
  #
  # cost_drawing_threshold は**表示専用**で、経路にもメモリにも影響しない。断片の 60 では
  # 2026-07-29 実測 (0.10m/cell = この scale 2) で到達可能セルの 66% が飽和し、階調が出るのは
  # ゴールから 60 ステップ以内の 6.83% だけだった。同じ計測の分布が中央値 60 / p90 110 /
  # p99 300 / 最大 680 で、p90 と p99 のあいだの ≒54m 相当に置く、という選び方。運用上通る
  # 範囲へ階調を集中させ、遠い裾だけ飽和させる。
  # **この実測は 1 ステップ = 0.3m の頃のもの**で、断片が 0.5m になったぶん同じ距離が 0.6 倍の
  # 手数で済む。180 -> 108 はその換算 (距離の意味は変えていない)。**分布は測り直していない**。
  #
  # waypoint_prefetch は true。VI はゴールごとに価値関数を解き直す
  # ので、巡回では点が変わるたびに丸ごと 1 回の solve が入り、そのあいだ機体が止まる
  # (19F の実測で 29 秒)。先読みは走行中に次の点を解いておいてそれを消す。代償は場が 2 本
  # 生きること (この地図は compact・scale 2 なので sink 95MB x2 = 190MB。断片の
  # compact_ram_limit_mb 4096MB に収まるのでディスクへも出ない) と、走行中ずっと 1 コア
  # (waypoint_prefetch_threads の既定 1) を solve に取られること。**津田沼も 2026-08-07 に
  # true にした**が、あちらは 648MB x2 = 1.3GB になる。**4GB 機ではどちらの地図でも外すこと。**
  # 効いたかはログの "prefetched the value function for" / "(..., prefetched)" で見る。
  # **未検証** — 2026-08-04 に断片で一度 true にしたとき走行中の固まりが出て容疑者の 1 つ
  # として戻した経緯がある (切り分けは未了)。再発したらここを false に戻すのが戻し方。
  vi_planner:
    ros__parameters:
      map_scale: 2                       # 既定 1 (断片は未設定): 内部だけ 0.10m/cell (794 万状態)。solve を軽くするため
      cost_drawing_threshold: 108        # 断片 60: 色スケール上限 [ステップ数≒秒] ≒54m (1 ステップ 0.5m)
      waypoint_prefetch: true            # 断片 false: 次の点を走行中に解いておく。点あたり 29 秒の停止が消える代わりに場が 2 本 (190MB) + 1 コア

  vi_global_planner:
    ros__parameters:
      map_scale: 2                       # 断片 1: 同上 (vi_planner と揃える)
      cost_drawing_threshold: 108        # 断片 60: 同上 (vi_planner と揃える)

# ── ここで上書きしていないもの ────────────────────────────────────────────
# この地図では断片 (= ほぼノード既定) のままで足りている。要るとしたら次の順で疑う。
#   emcl2.range_threshold / laser_likelihood_max_dist … 地図の壁の厚みが実物と違うとき。
#     今の 19F は貫通が多いので alpha_threshold 側で凌いでいる。
#   costmaps.*.inflation_radius … 通路幅が足りず経路が出ないとき。ただし外接円 0.408m を
#     下回らせないこと (daifuku_stack/config/nav2/costmaps.yaml)。
#   vi_planner.safety_radius_penalty … 通路が細くて貪欲ロールアウトが固着するとき。
#     map_tsudanuma では 1 まで下げている。
#   vi_*.compact_sink_dir … sink を RAM から追い出すとき。19F は scale 2 で 0.095GB なので
#     そもそも退避しない。逃がすなら速い実ディスクを明示すること。
#   vi_*.downsample_policy … 通路のセル幅が足りず波がゴール近傍で止まるとき。optimistic が
#     要るのは map_scale >= 4 からで、2 では通路が片側 0.05m しか細らない。
#   vi_planner.window_cost_drawing_threshold … 断片の 10 のまま。/local_window_value は
#     ±1m 窓なので、上の cost_drawing_threshold を上げても連動しない (別の色スケール)。
