# raspimouse (Raspberry Pi Cat 本体ドライバ) のパラメータ。
# 「既定」= 上流 raspicat_ros の config/raspicat.param.yaml。
# robot_bringup.launch.py が LifecycleNode の parameters= に直接渡す。
#
# このファイルは差分ではなく上流の**完全なコピー**。launch_ros はノード自身の
# parameters= をグローバル (SetParametersFromFile) より後に展開する = ノード側が
# 勝つので、上流 launch へ差分を重ねる方式では上書きできない (../README.md)。
# 下の 3 行以外は上流に追従すること。

raspimouse:
  ros__parameters:
    odometry_scale_left_wheel : 1.0
    odometry_scale_right_wheel: 1.0
    use_light_sensors         : true

    # 既定 false のまま: true (エンコーダ) が本来正しいが、この個体の I2C カウンタが
    # 走行中にランダムで固着してリブートが要る。天秤と復旧手順は ../README.md。
    use_pulse_counters        : false

    # 既定 0.1524 / 0.27918: この個体の実測値 (2026-08-03)。上流へ戻さないこと。
    wheel_diameter            : 0.2     # meters (実測 200 mm)
    wheel_tread               : 0.35    # meters (実測 350 mm)

    pulses_per_revolution     : 400.0
    light_sensors_hz          : 100.0
    odom_hz                   : 100.0
    switches_hz               : 10.0
    initial_motor_power       : false
    odom_frame_id             : "odom"
    odom_child_frame_id       : "base_footprint"
    odom_frame_prefix         : ""
