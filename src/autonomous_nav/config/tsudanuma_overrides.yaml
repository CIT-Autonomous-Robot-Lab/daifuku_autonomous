# map_tsudanuma.yaml (5888x4000 @0.05m, 294.4m x 200m) 用の追加パラメータ。
#
# 使い方 (nav2_params.yaml の上に重ねる):
#   ros2 launch autonomous_nav navigation.launch.py \
#       map:=<share>/maps/map_tsudanuma.yaml \
#       extra_params_file:=<share>/config/tsudanuma_overrides.yaml \
#       planner:=vi local_planner:=nav2
#
# なぜ必要か:
#   VI はゴールごとに nx*ny*n_theta の状態空間を扱う。津田沼を 0.05m のまま解くと
#   5888*4000*60 = 14.1 億状態で、既定の密ソルバ (frontier2d_sparse) は
#   State 56B/state = 79GB を確保しようとして起動と同時に死ぬ。
#   そこで
#     * map_scale: 3      -> プランナ内部だけ 0.15m/cell (1963x1334 = 1.57 億状態)。
#                            Ueda et al. 2023 の津田沼評価と同じセルサイズ。
#                            map_server / costmap / 自己位置は 0.05m のまま。
#     * solver: compact   -> states を確保しないアウトオブコア経路
#                            (solve_compact_mapped)。確定出力 12B/state のみ。
#     * compact_sink_dir  -> その確定出力 (1.9GB) をディスク mmap に置く。
#                            RAM に置くと Pi4 4GB では OOM kill される。
#   実測 (ローカル・16 コア無制限・シム): 初回 solve 25〜42 秒で収束し、
#   start (53.07,-21.62,90°) → goal (44.08,-5.12,0°) を 110.5 秒・リカバリ 0 で走破。
#   ただし vi_global_planner のピーク RSS は 3.98GB (匿名 2.16GB + mmap 1.81GB) で、
#   Raspberry Pi 4 4GB で通るかは未確認 (tools/pi4_sim/README.md 参照)。
#
# 注意:
#   * map_scale の 3x3 プーリングは障害物優先なので、通路は片側最大 0.10m 細る。
#     robot_radius 0.22 / inflation 0.55 と合わせて通れるかは経路ごとに確認すること。
#   * この地図は 68.2% が未観測 (205) で、真の占有セルは 0.4% しかない。
#     unknown_as_obstacle: true (既定) だと未観測が全て壁になる = 舗装路のみ通行可。
#     一方 emcl2/AMCL のスキャンマッチングは占有セルの尤度場を使うので、
#     この地図では拠り所がほとんど無い (別途要検討)。
#   * publish_value_function は既定 true だが、2.6M セル (2.6MB) の OccupancyGrid を
#     繰り返し配信することになるので、RViz で見ないなら false にする。

vi_global_planner:
  ros__parameters:
    solver: "frontier2d_sparse_compact"
    map_scale: 3
    # 確定出力 (1.89GB) の置き場。**tmpfs でないこと**を確認すること
    # (`findmnt -no FSTYPE /tmp`)。tmpfs だと結局 RAM に載るので、
    # メモリ退避の意味が無くなる。実ディスク上のパスを指定してもよい。
    compact_sink_dir: "/tmp/vi_global_planner_sink"
    # 障害物近傍ペナルティ [秒/セル]。既定の 30 はこの地図では使えない。
    #   * 1 手のコストは 1 秒。30 秒のペナルティを踏むセルが経路上に多数あると、
    #     価値関数は「移動時間」ではなく「ペナルティの積算」で決まる。
    #   * 津田沼は通路が細く (未観測を障害物とみなすため 1〜2 m 幅)、0.15 m セルでは
    #     ほとんどの自由セルが safety_radius 0.2 m 以内に入る。
    #   * VI の遷移はサブセルサンプリング付きの確率モデルなので、隣接状態間で
    #     ペナルティの重みが変わり、価値関数が局所的に ±3 秒ゆらぐ。1 手 1 秒の
    #     前進より揺らぎが大きいと、ノイズ無しの貪欲ロールアウトが降下できず
    #     隣接 θ 間で往復して LoopDetected になる (実測: penalty 30 で 83 手目で固着)。
    #   * 1.0 にすると同じ地図・同じゴールで単調に降下し、104 姿勢でゴールに到達する
    #     (この 2 つは価値関数を直接ロールアウトさせたオフライン計測。
    #      スタック全体での結果は tools/pi4_sim/README.md を参照)。
    #   * 揺らぎはペナルティにほぼ比例するので、10 秒未満なら 1 手 1 秒の進捗を
    #     下回るはず。壁に寄りすぎるなら 5 程度まで上げてから他をいじること。
    safety_radius_penalty: 1
    # 広域なのでゴールから遠い start でもロールアウトが届くように上限を上げる。
    max_rollout_steps: 100000
    publish_value_function: false

# vi_local_planner は compact 経路を持たず、全域を密に解き直すので広域地図では使えない。
# local_planner:=nav2 (controller_server/DWB) を使うこと。
