# ライフサイクルマネージャの bond タイムアウト。navigation.launch.py の
# SetParametersFromFile で、include 先 (nav2 navigation_launch.py) のマネージャにも
# 注入される。経緯は README.md の「値の由来」を参照。
lifecycle_manager_navigation:
  ros__parameters:
    bond_timeout: 60.0    # 既定 4.0 [s]: Pi4 の同時起動で bond 形成が間に合わない
lifecycle_manager_localization:
  ros__parameters:
    bond_timeout: 60.0    # 既定 4.0 [s]: 同上
