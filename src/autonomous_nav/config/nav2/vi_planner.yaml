# 価値反復プランナ (value_iteration3, Rust)。「既定」= 各ノードの main.rs が
# declare_parameter で持つ値。ここはほぼ既定の書き出しで、既定と違うのは
# map_wait_sec と compact_ram_limit_mb と vi_global_planner.solver の 3 つだけ。
# 地図ごとの調整は ../overrides/<地図名>.yaml に置く。合成順序と上書きは
# ../README.md を参照。
#
# ノードは 2 つあり、**同時には起動されない**。local_planner でどちらかが選ばれる:
#   local_planner:=vi   (auto + planner:=vi の既定) … vi_planner 1 ノード。
#                       1 本の価値関数で経路計画と経路追従の両方を担う。
#   local_planner:=nav2 … vi_global_planner (広域のみ) + controller_server (DWB)。
#
# 両者で意味の同じキーは値を揃えること (どちらで起動しても挙動が変わらないように)。

# ── local_planner:=vi: 統合プランナ (planner_server + controller_server 置換) ──
vi_planner:
  ros__parameters:
    use_sim_time: false
    # 既定 同左 (密): **密でなければ狭域 → 広域のフィードバックが効かない。**
    # 密は states を広域 (ロールアウト) と狭域 (スキャンの local_penalty) で共有し、
    # global_sweep がその書き込みを全域へ広げる。compact は states を作らないので
    # 共有場が無く、追従は避けても広域の経路は塞がった通路を指し続ける
    # (launch の _validate_vi_solver が compact + global_sweep を止める)。
    # 密の代償はメモリ (states 56B + sweep_orders 24B = 80B/state) で、これは
    # map_scale で落とす。19F は ../overrides/map_19f.yaml の scale 2 で実測 655MB。
    solver: "frontier2d_sparse"
    dense_limit_mb: 2048          # 既定 1500 [MB]: 密の価値関数 (states + sweep_orders) の上限。超えたら起動を止める。19F は map_scale 2 で実測 655MB
    compact_ram_limit_mb: 2048    # 既定 512 [MB]: **上の solver が密の間は効かない** (sink を作らないため)。compact に戻したときのための値。sink を RAM に置ける上限 (超過分は /tmp/vi_planner_sink へ mmap 退避)
    theta_cell_num: 60            # 既定 60: 姿勢の離散数。360 を割り切ること (t_resolution = 360/この値 が整数除算)
    safety_radius: 0.2            # 既定 0.2 [m]: 障害物近傍ペナルティの半径 (VI 内部の膨張)
    safety_radius_penalty: 30     # 既定 30 [秒/セル]: 障害物に近寄る代わりに払う迂回コスト
    goal_margin_radius: 0.3       # 既定 0.3 [m]: ゴール圏 (final_state) 判定半径 = ゴール許容差
    goal_margin_theta: 15.0       # 既定 15.0 [deg]: 同、角度
    map_wait_sec: 60              # 既定 30 [s]: /map の到着待ち上限。広域地図では遅い
    vi_threads: 0                 # 既定 0 (= 論理コア数): 価値反復のスレッド数 (VI_THREADS)
    solve_chunk: 64               # 既定 64 [イテレーション]: プリエンプト (中断要求) を見る間隔
    max_solve_iter: 1000000       # 既定 1000000: 価値反復の打ち切り回数
    goal_tolerance_xy: 0.25       # 既定 0.25 [m]: 価値関数キャッシュを再利用するゴール一致判定
    goal_tolerance_deg: 10.0      # 既定 10.0 [deg]: 同、角度
    unknown_as_obstacle: true     # 既定 true: 未観測セルを障害物として扱う
    # ── 広域 (compute_path_to_pose) ──
    max_rollout_steps: 10000      # 既定 10000: 方策を辿って経路を作るときの最大手数
    start_tolerance: 0.5          # 既定 0.5 [m]: start が方策なしセルのときの近傍スナップ半径
    path_spacing: 0.05            # 既定 0.05 [m]: 出力する Path の姿勢間隔 (0 で補間しない)
    # ── 狭域 (follow_path) ──
    control_frequency: 10.0       # 既定 10.0 [Hz]: cmd_vel を出す周期
    refine_budget_ms: 40          # 既定 40 [ms/tick]: ローカルウィンドウ価値反復に使う時間予算
    action_tolerance: 0.2         # 既定 0.2 [m]: 方策なしセルでの近傍行動探索半径
    no_action_timeout_sec: 3.0    # 既定 3.0 [s]: pose か方策が無い状態がこれだけ続いたら追従を中断
    # ── 狭域 → 広域のフィードバック (共有価値関数の全域掃き) ──
    # 追従が書いた local_penalty はローカルウィンドウ (±1m) の中で値を上げるだけで
    # 外へは広がらない。これを切ると、狭域が「通れない」と判断しても広域の経路は
    # 塞がった通路を指し続ける (それが LoopDetected と復帰行動の空回りの入口)。
    # budget:idle の比がそのまま CPU の取り分。追従ループは同じ Mutex を try_lock で
    # 取り、3 tick 続けて取れないとロボットを止めるので、budget を伸ばすときは
    # idle も一緒に伸ばすこと。1 掃きの実測は起動ログの "global sweep done in" に出る。
    global_sweep: true            # 既定 true: 全域掃きを回すか (密ソルバ専用)
    global_sweep_budget_ms: 20    # 既定 20 [ms]: 1 回のロック取得で掃きに使う時間
    global_sweep_idle_ms: 60      # 既定 60 [ms]: そのあとロックを手放して待つ時間 (20:60 = 1 コアの 25%)
    # ── 可視化 (経路計算には影響しない) ──
    publish_value_function: true  # 既定 true: /value_function を配信するか
    value_publish_interval_ms: 500  # 既定 500 [ms]: solve 途中経過の配信間隔 (0 で完了時のみ)
    # 色スケール上限 [ステップ数≒秒]。地図ごとに測り直す値なので、ここは地図非依存の
    # 既定のまま。19F の 180 は ../overrides/map_19f.yaml、選び方は ../README.md。
    cost_drawing_threshold: 60    # 既定 60: /value_function の色スケール上限
    window_cost_drawing_threshold: 60  # 既定 60: /local_window_value (±1m 窓) の色スケール上限
    # ── 行動集合 (前進量と回転量の組。要素数は 3 つの配列で揃えること) ──
    # ここで決めた値がそのまま遷移表になる (起動時に作られる)。数も 6 でなくてよい。
    action_names: ["forward", "back", "right", "rightfw", "left", "leftfw"]  # 既定 同左
    action_forward_m: [0.3, -0.2, 0.0, 0.2, 0.0, 0.2]      # 既定 同左 [m]: 各行動の前進量
    action_rotation_deg: [0.0, 0.0, -20.0, -20.0, 20.0, 20.0]  # 既定 同左 [deg]: 各行動の回転量

    # ── 未設定 (既定のまま) ──
    # map_scale: 1                # プランナ内部で地図を粗くする倍率 (1 = /map のまま)
    # downsample_policy: "conservative"  # map_scale > 1 のときの縮小方針。conservative = 障害物優先、
    #                             # optimistic = ブロック内に free が 1 つでもあれば free
    # compact_sink_dir: ""        # compact 解の置き場 ("" = RAM)。追従はパッチ置き直しのたびに
    #                             # sink を読むので、退避先が遅いと制御周期に響く
    #     ▲ 上 3 つの実例は ../overrides/map_tsudanuma.yaml (scale 5 + 楽観 + ディスク退避)。
    #       map_scale だけなら ../overrides/map_19f.yaml (scale 2、保守のまま)。
    #       ただし tsudanuma のように compact が要る大きさの地図では、上の
    #       global_sweep を false にしないと launch が止める (共有場が無いため)。
    # pose_topic: "mcl_pose"      # 自己位置を読むトピック。launch が上書きする
    # scan_topic: "scan"          # スキャンを読むトピック。launch が上書きする
    # global_frame: "map"         # 出力する Path のフレーム

# ── local_planner:=nav2: 広域のみ (planner_server 置換、追従は controller_server) ──
vi_global_planner:
  ros__parameters:
    use_sim_time: false
    solver: "frontier2d_sparse_compact"  # 既定 frontier2d_sparse (密): vi_planner と揃える。実例は ../overrides/map_tsudanuma.yaml
    map_scale: 1                  # 既定 1: プランナ内部で地図を粗くする倍率 (1 = /map のまま)。19F は ../overrides/ で 2
    compact_sink_dir: ""          # 既定 "": compact の確定出力先 ("" = RAM)
    compact_ram_limit_mb: 2048    # 既定 512 [MB]: sink を RAM に置ける上限 (超過分は /tmp/vi_global_planner_sink へ mmap 退避)。vi_planner と揃える。compact_sink_dir 無しの広域地図では 2GiB を RAM に抱えたまま OOM し得る
    theta_cell_num: 60            # 既定 60: 姿勢の離散数。360 を割り切ること
    safety_radius: 0.2            # 既定 0.2 [m]: 障害物近傍ペナルティの半径
    safety_radius_penalty: 30     # 既定 30 [秒/セル]: 障害物に近寄る代わりに払う迂回コスト
    goal_margin_radius: 0.3       # 既定 0.3 [m]: ゴール圏 (final_state) 判定半径
    goal_margin_theta: 15.0       # 既定 15.0 [deg]: 同、角度
    map_wait_sec: 60              # 既定 30 [s]: /map の到着待ち上限。広域地図では遅い
    vi_threads: 0                 # 既定 0 (= 論理コア数): 価値反復のスレッド数
    solve_chunk: 64               # 既定 64 [イテレーション]: プリエンプトを見る間隔
    max_solve_iter: 1000000       # 既定 1000000: 価値反復の打ち切り回数
    max_rollout_steps: 10000      # 既定 10000: 方策を辿って経路を作るときの最大手数
    start_tolerance: 0.5          # 既定 0.5 [m]: start が方策なしセルのときの近傍スナップ半径
    path_spacing: 0.05            # 既定 0.05 [m]: Path の姿勢間隔 (DWB 向け補間; 0 で無効)
    goal_tolerance_xy: 0.25       # 既定 0.25 [m]: 価値関数キャッシュを再利用するゴール一致判定
    goal_tolerance_deg: 10.0      # 既定 10.0 [deg]: 同、角度
    cost_drawing_threshold: 60    # 既定 60: /value_function の色スケール上限 (vi_planner と同じ扱い)
    publish_value_function: true  # 既定 true: /value_function を配信するか
    value_publish_interval_ms: 500  # 既定 500 [ms]: solve 途中経過の配信間隔 (0 で完了時のみ)
    unknown_as_obstacle: true     # 既定 true: 未観測セルを障害物として扱う
    action_names: ["forward", "back", "right", "rightfw", "left", "leftfw"]  # 既定 同左
    action_forward_m: [0.3, -0.2, 0.0, 0.2, 0.0, 0.2]      # 既定 同左 [m]
    action_rotation_deg: [0.0, 0.0, -20.0, -20.0, 20.0, 20.0]  # 既定 同左 [deg]

    # ── 未設定 (既定のまま) ──
    # downsample_policy: "conservative"  # map_scale > 1 のときの縮小方針
    # pose_topic: "mcl_pose"      # 自己位置を読むトピック。launch が上書きする
    # global_frame: "map"         # 出力する Path のフレーム
    #     ▲ vi_global_planner は広域専用なので scan_topic / control_frequency /
    #       refine_budget_ms / action_tolerance / no_action_timeout_sec /
    #       window_cost_drawing_threshold は**そもそも持たない**。
