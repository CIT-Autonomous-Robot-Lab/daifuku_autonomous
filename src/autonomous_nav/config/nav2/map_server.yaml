# 地図の配信と保存。yaml_filename は launch の map:= が上書きする。
# 全キー nav2_bringup の既定のまま。合成順序と上書きは ../README.md を参照。

map_server:
  ros__parameters:
    use_sim_time: false
    yaml_filename: ""


map_saver:
  ros__parameters:
    use_sim_time: false
    save_map_timeout: 5.0
    free_thresh_default: 0.25
    occupied_thresh_default: 0.65
    map_subscribe_transient_local: true
