# planner:=navfn のグローバルプランナ。「既定」= nav2_bringup の nav2_params.yaml。
# planner:=vi では起動せず、vi_planner.yaml の vi_global_planner が
# compute_path_to_pose を提供する。合成順序と上書きは ../README.md を参照。

planner_server:
  ros__parameters:
    expected_planner_frequency: 1.0   # 既定 20.0: 実測 7.6Hz で WARN 連発。BT の再計画は 1Hz
    use_sim_time: false
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_navfn_planner/NavfnPlanner"
      tolerance: 0.5
      use_astar: false                # 既定 true: 根拠未記録 (f867da4)
      allow_unknown: true
