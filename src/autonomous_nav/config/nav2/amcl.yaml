# localization:=amcl の自己位置推定。「既定」= nav2_bringup の nav2_params.yaml。
# localization:=emcl2 (既定) では起動せず、../localization/emcl2.yaml が使われる。
# nav2 の localization_launch.py が params_file から読むので、断片はここに置く。
# 合成順序と上書きは ../README.md を参照。
#
# 既定から変えた 8 つ (do_beamskip / max_beams / *_particles / recovery_alpha_* /
# update_min_*) は f867da4 でまとめて入ったもので、理由が記録されていない。
# amcl は普段使わないため未検証のまま残してある。

amcl:
  ros__parameters:
    use_sim_time: false
    alpha1: 0.2
    alpha2: 0.2
    alpha3: 0.2
    alpha4: 0.2
    alpha5: 0.2
    base_frame_id: "base_footprint"
    beam_skip_distance: 0.5
    beam_skip_error_threshold: 0.9
    beam_skip_threshold: 0.3
    do_beamskip: true                 # 既定 false: 根拠未記録
    global_frame_id: "map"
    lambda_short: 0.1
    laser_likelihood_max_dist: 2.0
    laser_max_range: 100.0
    laser_min_range: -1.0
    laser_model_type: "likelihood_field"
    max_beams: 120                    # 既定 60: 根拠未記録
    max_particles: 8000               # 既定 2000: 根拠未記録
    min_particles: 1000               # 既定 500: 根拠未記録
    odom_frame_id: "odom"
    pf_err: 0.05
    pf_z: 0.99
    recovery_alpha_fast: 0.1          # 既定 0.0: 根拠未記録
    recovery_alpha_slow: 0.001        # 既定 0.0: 根拠未記録
    resample_interval: 1
    robot_model_type: "nav2_amcl::DifferentialMotionModel"
    save_pose_rate: 0.5
    sigma_hit: 0.2
    tf_broadcast: true
    transform_tolerance: 1.0
    update_min_a: 0.05                # 既定 0.2: 根拠未記録
    update_min_d: 0.05                # 既定 0.25: 根拠未記録
    z_hit: 0.5
    z_max: 0.05
    z_rand: 0.5
    z_short: 0.05
    scan_topic: scan
