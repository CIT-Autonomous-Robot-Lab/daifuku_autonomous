# ローカル / グローバルコストマップ。「既定」= nav2_bringup の nav2_params.yaml。
# planner:=vi は自前で /map を解くので global_costmap を使わないが、bt_navigator の
# クリア系サービスが参照する。合成順序と上書きは ../README.md を参照。
#
# footprint は local と global に同じ値を 2 度書いている。YAML アンカーで共有すると
# rcl のパーサが最上位キーをノード名として読めずに落ちるため。片方だけ直さないこと。

local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_footprint   # 既定 base_link: URDF に base_link が無い
      use_sim_time: false
      rolling_window: true
      width: 3
      height: 3
      resolution: 0.05
      # 既定 robot_radius 0.22: 実測 420x450mm の多角形にした (../README.md)。
      # robot_radius は書かないこと (両方あると footprint が勝って紛らわしい)。
      footprint: "[[0.10, 0.21], [0.10, -0.21], [-0.35, -0.21], [-0.35, 0.21]]"
      plugins: ["voxel_layer", "inflation_layer"]
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.55           # 外接円 0.408m 以上にすること
      voxel_layer:
        plugin: "nav2_costmap_2d::VoxelLayer"
        enabled: true
        publish_voxel_map: true
        origin_z: 0.0
        z_resolution: 0.05
        z_voxels: 16
        max_obstacle_height: 2.0
        mark_threshold: 0
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          data_type: "LaserScan"
          raytrace_max_range: 3.0
          raytrace_min_range: 0.0
          obstacle_max_range: 2.5
          obstacle_min_range: 0.0
      always_send_full_costmap: true


global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_footprint   # 既定 base_link: URDF に base_link が無い
      use_sim_time: false
      # local_costmap と同値。片方だけ直さないこと。
      footprint: "[[0.10, 0.21], [0.10, -0.21], [-0.35, -0.21], [-0.35, 0.21]]"
      resolution: 0.05
      track_unknown_space: true
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          data_type: "LaserScan"
          raytrace_max_range: 3.0
          raytrace_min_range: 0.0
          obstacle_max_range: 2.5
          obstacle_min_range: 0.0
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: true
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.55           # 外接円 0.408m 以上にすること
      always_send_full_costmap: true
