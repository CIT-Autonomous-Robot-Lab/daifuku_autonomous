# Pi4 では非コンポジション起動時に 8 プロセスが同時に spin up して load が
# 10〜19 まで跳ね、bond 形成がデフォルトの 4 秒に間に合わず lifecycle manager が
# 「unable to be reached after 4.00s by bond → Aborting bringup」で落ちる
# (2026-07-24 実測)。形成待ちと心拍途絶判定を 60 秒まで許容する。
# このファイルは navigation.launch.py の SetParametersFromFile で
# include 先 (nav2 navigation_launch.py) のマネージャにも注入される。
lifecycle_manager_navigation:
  ros__parameters:
    bond_timeout: 60.0
lifecycle_manager_localization:
  ros__parameters:
    bond_timeout: 60.0
