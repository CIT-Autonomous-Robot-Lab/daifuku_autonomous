amcl:
  ros__parameters:
    use_sim_time: false
    alpha1: 0.2
    alpha2: 0.2
    alpha3: 0.2
    alpha4: 0.2
    alpha5: 0.2
    base_frame_id: "base_footprint"
    beam_skip_distance: 0.5
    beam_skip_error_threshold: 0.9
    beam_skip_threshold: 0.3
    do_beamskip: true
    global_frame_id: "map"
    lambda_short: 0.1
    laser_likelihood_max_dist: 2.0
    laser_max_range: 100.0
    laser_min_range: -1.0
    laser_model_type: "likelihood_field"
    max_beams: 120
    max_particles: 8000
    min_particles: 1000
    odom_frame_id: "odom"
    pf_err: 0.05
    pf_z: 0.99
    recovery_alpha_fast: 0.1
    recovery_alpha_slow: 0.001
    resample_interval: 1
    robot_model_type: "nav2_amcl::DifferentialMotionModel"
    save_pose_rate: 0.5
    sigma_hit: 0.2
    tf_broadcast: true
    transform_tolerance: 1.0
    update_min_a: 0.05
    update_min_d: 0.05
    z_hit: 0.5
    z_max: 0.05
    z_rand: 0.5
    z_short: 0.05
    scan_topic: scan

bt_navigator:
  ros__parameters:
    use_sim_time: false
    global_frame: map
    robot_base_frame: base_footprint
    odom_topic: /odom
    bt_loop_duration: 10
    # BtActionNode がアクションサーバのゴール受理 ack を待つ時間 [ms]。
    # nav2 既定の 20ms は Pi4 の CPU 飽和時に短すぎ、compute_path_to_pose /
    # spin / wait / backup が軒並み ack を取りこぼしてゴールが 0.2 秒で
    # ABORTED になる (tools/pi4_sim の Pi4 相当環境で再現・切り分け済み。
    # nr_throttled が 10 万回級の状態では rclrs も nav2 も 20ms に間に合わない)。
    # 資源に余裕があれば 20ms でも通るので、これは純粋な保険。
    default_server_timeout: 500
    # BT の読み込み時に各アクション/サービスサーバの出現を待つ時間 [ms]。
    # planner:=vi では vi_global_planner が /map を受け取ってから
    # compute_path_to_pose を作るので、地図が大きいほど遅れる (map_tsudanuma
    # 23.5MB では nav2 既定の 1000ms に間に合わず、bt_navigator が
    # on_configure で "action server not available" を投げて bringup 全体が
    # 止まった)。起動時にしか効かない待ちなので長めに取る。
    wait_for_service_timeout: 60000
    plugin_lib_names:
      - nav2_compute_path_to_pose_action_bt_node
      - nav2_compute_path_through_poses_action_bt_node
      - nav2_smooth_path_action_bt_node
      - nav2_follow_path_action_bt_node
      - nav2_spin_action_bt_node
      - nav2_wait_action_bt_node
      - nav2_assisted_teleop_action_bt_node
      - nav2_back_up_action_bt_node
      - nav2_drive_on_heading_bt_node
      - nav2_clear_costmap_service_bt_node
      - nav2_is_stuck_condition_bt_node
      - nav2_goal_reached_condition_bt_node
      - nav2_goal_updated_condition_bt_node
      - nav2_globally_updated_goal_condition_bt_node
      - nav2_is_path_valid_condition_bt_node
      - nav2_initial_pose_received_condition_bt_node
      - nav2_reinitialize_global_localization_service_bt_node
      - nav2_rate_controller_bt_node
      - nav2_distance_controller_bt_node
      - nav2_speed_controller_bt_node
      - nav2_truncate_path_action_bt_node
      - nav2_truncate_path_local_action_bt_node
      - nav2_goal_updater_node_bt_node
      - nav2_recovery_node_bt_node
      - nav2_pipeline_sequence_bt_node
      - nav2_round_robin_node_bt_node
      - nav2_transform_available_condition_bt_node
      - nav2_time_expired_condition_bt_node
      - nav2_path_expiring_timer_condition
      - nav2_distance_traveled_condition_bt_node
      - nav2_single_trigger_bt_node
      - nav2_goal_updated_controller_bt_node
      - nav2_is_battery_low_condition_bt_node
      - nav2_navigate_through_poses_action_bt_node
      - nav2_navigate_to_pose_action_bt_node
      - nav2_remove_passed_goals_action_bt_node
      - nav2_planner_selector_bt_node
      - nav2_controller_selector_bt_node
      - nav2_goal_checker_selector_bt_node
      - nav2_controller_cancel_bt_node
      - nav2_path_longer_on_approach_bt_node
      - nav2_wait_cancel_bt_node
      - nav2_spin_cancel_bt_node
      - nav2_back_up_cancel_bt_node
      - nav2_assisted_teleop_cancel_bt_node
      - nav2_drive_on_heading_cancel_bt_node
      - nav2_is_battery_charging_condition_bt_node

bt_navigator_navigate_through_poses_rclcpp_node:
  ros__parameters:
    use_sim_time: false

bt_navigator_navigate_to_pose_rclcpp_node:
  ros__parameters:
    use_sim_time: false

controller_server:
  ros__parameters:
    use_sim_time: false
    # Pi4はCPU飽和気味 (20Hzはbond心拍途絶=CRITICAL FAILUREの誘因になった)。
    # 最高速0.2m/s級の車体には10Hzで十分。
    controller_frequency: 10.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.5
      movement_time_allowance: 10.0
    general_goal_checker:
      stateful: true
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.25
      yaw_goal_tolerance: 0.25
    FollowPath:
      plugin: "dwb_core::DWBLocalPlanner"
      debug_trajectory_details: true
      min_vel_x: 0.0
      min_vel_y: 0.0
      max_vel_x: 0.4
      max_vel_y: 0.0
      max_vel_theta: 1.0
      min_speed_xy: 0.0
      max_speed_xy: 0.4
      min_speed_theta: 0.0
      acc_lim_x: 2.5
      acc_lim_y: 0.0
      acc_lim_theta: 3.2
      decel_lim_x: -2.5
      decel_lim_y: 0.0
      decel_lim_theta: -3.2
      vx_samples: 20
      vy_samples: 5
      vtheta_samples: 20
      sim_time: 1.7
      linear_granularity: 0.05
      angular_granularity: 0.025
      # dwb_core::transformGlobalPlan がロボット姿勢を経路の frame に変換する際の
      # 許容遅延 [s]。0.2 は実機のスキャン経路の遅延そのものだった。
      # 2026-07-29 実機計測: map->odom の遅延は 67 件すべてが 0.20〜0.47 s に収まり、
      # 最小値がちょうど 0.2 = この閾値。閾値の直上に貼り付いた定常オフセットで、
      # emcl2 の TF 再発行は約 110ms 間隔で一定 (= 止まってはいない)。遅延の実体は
      # livox -> pointcloud_to_laserscan -> restamp_scan -> filter chain -> emcl2 の
      # パイプラインで、TF はスキャン時刻で打たれる。結果、制御周期の 11% が
      # "Transform data too old" で落ち、連続失敗が failure_tolerance 0.3 s を
      # 超えた時点で follow_path が Aborting → ゴールが ABORTED になった。
      # 1.0 は amcl セクションと同値。代償は最大 1 s 古い姿勢で制御しうること
      # (最高速 0.2 m/s なので位置ずれは最大 0.2 m)。
      # 本筋の対処はスキャン経路の遅延そのものを削ること。
      transform_tolerance: 1.0
      xy_goal_tolerance: 0.25
      trans_stopped_velocity: 0.25
      short_circuit_trajectory_evaluation: true
      stateful: true
      critics: ["RotateToGoal", "Oscillation", "BaseObstacle", "GoalAlign", "PathAlign", "PathDist", "GoalDist"]
      BaseObstacle.scale: 0.02
      PathAlign.scale: 32.0
      PathAlign.forward_point_distance: 0.1
      GoalAlign.scale: 24.0
      GoalAlign.forward_point_distance: 0.1
      PathDist.scale: 32.0
      GoalDist.scale: 24.0
      RotateToGoal.scale: 32.0
      RotateToGoal.slowing_factor: 5.0
      RotateToGoal.lookahead_time: -1.0

local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_footprint
      use_sim_time: false
      rolling_window: true
      width: 3
      height: 3
      resolution: 0.05
      robot_radius: 0.22
      plugins: ["voxel_layer", "inflation_layer"]
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.55
      voxel_layer:
        plugin: "nav2_costmap_2d::VoxelLayer"
        enabled: true
        publish_voxel_map: true
        origin_z: 0.0
        z_resolution: 0.05
        z_voxels: 16
        max_obstacle_height: 2.0
        mark_threshold: 0
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          data_type: "LaserScan"
          raytrace_max_range: 3.0
          raytrace_min_range: 0.0
          obstacle_max_range: 2.5
          obstacle_min_range: 0.0
      always_send_full_costmap: true

global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_footprint
      use_sim_time: false
      robot_radius: 0.22
      resolution: 0.05
      track_unknown_space: true
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          data_type: "LaserScan"
          raytrace_max_range: 3.0
          raytrace_min_range: 0.0
          obstacle_max_range: 2.5
          obstacle_min_range: 0.0
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: true
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.55
      always_send_full_costmap: true

map_server:
  ros__parameters:
    use_sim_time: false
    yaml_filename: ""

map_saver:
  ros__parameters:
    use_sim_time: false
    save_map_timeout: 5.0
    free_thresh_default: 0.25
    occupied_thresh_default: 0.65
    map_subscribe_transient_local: true

# planner:=navfn のときのみ使用 (planner:=vi では planner_server は起動しない)。
planner_server:
  ros__parameters:
    # 実測7.6Hzしか出ずWARN連発していた。BTの再プラン周期は1Hzなので1.0で十分。
    expected_planner_frequency: 1.0
    use_sim_time: false
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_navfn_planner/NavfnPlanner"
      tolerance: 0.5
      use_astar: false
      allow_unknown: true

# planner:=vi (デフォルト) のグローバルプランナ。value_iteration3 の vi_global_planner
# (Rust) が planner_server の代わりに compute_path_to_pose を提供する。
# pose_topic は launch 側 (localization に応じて mcl_pose / amcl_pose) が上書きする。
vi_global_planner:
  ros__parameters:
    use_sim_time: false
    solver: "frontier2d_sparse"   # U64Solver::from_name の任意のソルバ名
    # 広域地図 (map_tsudanuma 等) では frontier2d_sparse_compact + map_scale を使う。
    # compact は states (56B x nx*ny*n_theta) を確保しないアウトオブコア経路で、
    # 確定出力だけを RAM か compact_sink_dir 上の mmap に置く (12B/state)。
    # 詳細と実測値は config/tsudanuma_overrides.yaml と tools/pi4_sim/README.md。
    map_scale: 1                  # プランナ内部で地図を粗くする倍率 (1 = /map のまま)
    compact_sink_dir: ""          # compact の確定出力先 ("" = RAM)
    compact_ram_limit_mb: 512     # RAM 出力がこれを超えると自動でディスクへ退避
    theta_cell_num: 60
    safety_radius: 0.2            # [m] 障害物近傍ペナルティ半径 (VI 内部の膨張)
    # [秒/セル] safety_radius 以内のセルを通るときの加算コスト。1 手 = 1 秒なので、
    # 30 は「近寄るくらいなら 30 手迂回する」という強い忌避になる。経路の大半が
    # ペナルティ域に入る細い通路の地図では価値関数が移動時間ではなくペナルティで
    # 決まり、貪欲ロールアウトが降下できなくなる (config/tsudanuma_overrides.yaml 参照)。
    safety_radius_penalty: 30
    goal_margin_radius: 0.3       # [m] final_state (ゴール圏) 判定半径
    goal_margin_theta: 15.0       # [deg]
    map_wait_sec: 60
    vi_threads: 0                 # 0 = 論理コア数 (VI_THREADS)
    solve_chunk: 64               # プリエンプト観測間隔 (VI イテレーション)
    max_solve_iter: 1000000
    max_rollout_steps: 10000
    start_tolerance: 0.5          # [m] start が方策なしセルのときの近傍スナップ半径
    path_spacing: 0.05            # [m] Path の姿勢間隔 (DWB 向け補間; 0 で無効)
    goal_tolerance_xy: 0.25       # [m] 価値関数キャッシュを再利用するゴール一致判定
    goal_tolerance_deg: 10.0      # [deg]
    # value_function 可視化のスケール上限 [ステップ数≒秒]。これを超えるセルは
    # すべて 100 に飽和するので、RViz 上ではゴールから離れた領域が一様に潰れて
    # 「価値関数が途中で途切れている」ように見える (経路計算には一切影響しない、
    # 表示専用のパラメータ)。
    # 2026-07-29 実機計測 (map_10cm, 458x289): 60 だと到達可能セルの 66% が
    # 100 に張り付き、グラデーションが出るのはゴールから 60 ステップ以内の
    # 6.83% だけだった (未到達 -1 が 80.07% / 飽和 100 が 13.10% / 1..99 が 6.83%)。
    # 1 ステップ = action_forward_m 0.3 m なので 60 ステップ ≒ 18 m 相当で、
    # 建物一周の廊下長にまったく足りない。
    cost_drawing_threshold: 1000
    publish_value_function: true
    value_publish_interval_ms: 500  # [ms] solve 途中経過の配信間隔 (0 で完了時のみ)
    unknown_as_obstacle: true
    allow_action_mismatch: false
    action_names: ["forward", "back", "right", "rightfw", "left", "leftfw"]
    action_forward_m: [0.3, -0.2, 0.0, 0.2, 0.0, 0.2]
    action_rotation_deg: [0.0, 0.0, -20.0, -20.0, 20.0, 20.0]

# local_planner:=vi の狭域プランナ。value_iteration3 の vi_local_planner (Rust)
# が controller_server の代わりに follow_path を提供する。ゴール判定は VI の
# final_state (goal_margin_*) 自体が担う。pose_topic / scan_topic は launch 側が
# 上書きする。地図・アクション系のパラメータは vi_global_planner と一致させること
# (別プロセスで同じ価値関数を解き直すため)。
vi_local_planner:
  ros__parameters:
    use_sim_time: false
    solver: "frontier2d_sparse"
    theta_cell_num: 60
    safety_radius: 0.2
    safety_radius_penalty: 30
    goal_margin_radius: 0.3       # [m] final_state (ゴール圏) 判定半径 = ゴール許容差
    goal_margin_theta: 15.0       # [deg]
    map_wait_sec: 60
    vi_threads: 0
    solve_chunk: 64
    max_solve_iter: 1000000
    goal_tolerance_xy: 0.25       # [m] 価値関数キャッシュを再利用するゴール一致判定
    goal_tolerance_deg: 10.0      # [deg]
    control_frequency: 10.0       # [Hz] 制御周期 (本家 ViNode::decision の 100ms)
    refine_budget_ms: 40          # [ms/tick] ローカルウィンドウ価値反復の時間予算
    action_tolerance: 0.2         # [m] 方策なしセルでの近傍行動探索半径
    no_action_timeout_sec: 3.0    # pose/方策なしがこの秒数続いたら追従を中断
    cost_drawing_threshold: 60    # local_value_function / local_window_value のスケール上限
    publish_value_function: true  # solve 経過を local_value_function、追従中の±1m 窓を local_window_value へ
    value_publish_interval_ms: 500  # [ms] 可視化配信間隔 (0 で solve 完了時のみ)
    unknown_as_obstacle: true
    allow_action_mismatch: false
    action_names: ["forward", "back", "right", "rightfw", "left", "leftfw"]
    action_forward_m: [0.3, -0.2, 0.0, 0.2, 0.0, 0.2]
    action_rotation_deg: [0.0, 0.0, -20.0, -20.0, 20.0, 20.0]

smoother_server:
  ros__parameters:
    use_sim_time: false
    smoother_plugins: ["simple_smoother"]
    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: true

behavior_server:
  ros__parameters:
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "drive_on_heading", "assisted_teleop", "wait"]
    spin:
      plugin: "nav2_behaviors/Spin"
    backup:
      plugin: "nav2_behaviors/BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors/DriveOnHeading"
    wait:
      plugin: "nav2_behaviors/Wait"
    assisted_teleop:
      plugin: "nav2_behaviors/AssistedTeleop"
    global_frame: odom
    robot_base_frame: base_footprint
    transform_tolerance: 0.1
    use_sim_time: false
    simulate_ahead_time: 2.0
    max_rotational_vel: 1.0
    min_rotational_vel: 0.5
    rotational_acc_lim: 3.2

waypoint_follower:
  ros__parameters:
    use_sim_time: false
    loop_rate: 20
    stop_on_failure: false
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: true
      waypoint_pause_duration: 200

velocity_smoother:
  ros__parameters:
    use_sim_time: false
    smoothing_frequency: 20.0
    scale_velocities: false
    feedback: "OPEN_LOOP"
    max_velocity: [0.4, 0.0, 1.0]
    min_velocity: [-0.4, 0.0, -1.0]
    max_accel: [2.5, 0.0, 3.2]
    max_decel: [-2.5, 0.0, -3.2]
    odom_topic: "odom"
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 1.0
