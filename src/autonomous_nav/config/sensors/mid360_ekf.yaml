ekf_filter_node:
  ros__parameters:
    frequency: 30.0
    sensor_timeout: 0.2
    two_d_mode: true
    transform_time_offset: 0.0
    transform_timeout: 0.1
    print_diagnostics: true
    publish_tf: true
    publish_acceleration: false
    reset_on_time_jump: true

    map_frame: map
    odom_frame: odom
    base_link_frame: base_footprint
    world_frame: odom

    odom0: /wheel/odom
    imu0: /imu/mid360

    # State order: x, y, z, roll, pitch, yaw, vx, vy, vz,
    #              vroll, vpitch, vyaw, ax, ay, az
    odom0_config: [false, false, false,
                   false, false, false,
                   true,  false, false,
                   false, false, true,
                   false, false, false]
    imu0_config:  [false, false, false,
                   false, false, false,
                   false, false, false,
                   false, false, true,
                   false, false, false]
    odom0_queue_size: 10
    imu0_queue_size: 50
    odom0_nodelay: true
    imu0_nodelay: true
    odom0_differential: false
    imu0_differential: false
    imu0_remove_gravitational_acceleration: false
