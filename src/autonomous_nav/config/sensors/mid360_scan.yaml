pointcloud_to_laserscan:
  ros__parameters:
    # Transform first so the height slice is expressed from the floor.
    target_frame: base_footprint
    transform_tolerance: 0.05
    # base_footprint (接地面) 基準。Mid-360 の搭載高さは実測 275 mm なので、
    # min_height 0.275 = センサ面ちょうど。水平より下に落ちる戻り (床や近くの
    # 低い反射) を捨て、水平から上だけを 2D スキャンに使う。
    # ここを下げると床が壁として載るリスクが出る。lidar_z を変えたら合わせること。
    min_height: 0.275
    max_height: 0.50
    angle_min: -3.141592654
    angle_max: 3.141592654
    angle_increment: 0.008726646
    queue_size: 4
    scan_time: 0.10
    range_min: 0.23
    range_max: 10.0
    use_inf: true
