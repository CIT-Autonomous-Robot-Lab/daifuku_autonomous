# waypoints_tsudanuma_mugimaru_v1.0.yaml
#
# waypoints_tsudanuma_v1.4.yaml (maps/tsudanuma、0.05m/セル・原点 [-100,-100]) を
# tsudanuma_mugimaru の座標系 (0.1m/セル・原点 [-68.946,-101.928]) へ移したもの。
# 2026-08-26 に機械変換。**実機でも RViz でも見ていない。**
#
# 求め方: 両地図の占有セルを剛体位置合わせ (FFT 相関で粗探索 -> 最近傍一致率で
#   精密化) して全体を theta=2.203 deg / t=(11.655, -19.991) で移し、そのあと**各点の
#   まわり 30m の壁だけで剛体 ICP をやり直して**いる。2 枚は別々の SLAM 実行で
#   片端に 1m 級のドリフトがあり、1 つの剛体では吸収できないため (全体剛体だけの
#   位置との差は最大 1.93m)。姿勢 (yaw) も各点の局所回転ぶん回してある。
#   位置合わせの相手は localization 側の地図 (tsudanuma-challenge_loc3.pgm)。
#   nav 側は手描きの壁 853m2 を含むので位置合わせには使わない。
#
# 検査: 移した 68 点すべてが nav3_9 (経路計画側) で「観測済みの空き」(未観測の
#   205 は空きに数えない) で、機体の外接円 0.408m ぶん空いている
#   (stack/nav2/costmaps.yaml の footprint より)。うち 11 点は変換した先が
#   埋まっていたので、いちばん近い入るセルへ寄せてある (最大 1.06m)。
#   **手描きの壁の中に入っていないことしか見ていない** — 実際に走ってよい
#   場所かは人が見ること。
