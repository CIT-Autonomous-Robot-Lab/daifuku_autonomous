# Mid-360 の 3D 点群を仰角で切り、センサー後方の直方体内を除去する。
# 「既定」= src/elevation_filter.py の declare_parameter。scan_pipeline.launch.py が
# ノードへ直接渡す。pointcloud_to_laserscan の**手前**に入り、切った残りを
# /livox/lidar_elevation へ出す。導出と地図ごとの値は ../README.md と ../sites/。
# mid360_scan.yaml の min_height と違い、これは**距離に比例する下限**になるので
# (base_footprint で見ると lidar_z + 距離 x tan(min_elevation))、min_elevation より緩い
# 勾配は**どの距離でも入らない**。下の 0.0 度は搭載高 (0.275m) の水平面そのもので、
# 19F の断片が持つ min_height: 0.275 と**同じ切り方**。

elevation_filter:
  ros__parameters:
    min_elevation_deg: 0.0    # 既定 -90.0 (制限なし) [deg]: これより下を向いた点を捨てる。勾配対策はこれを上げる
    max_elevation_deg: 90.0   # 既定 同左 (制限なし) [deg]: これより上を向いた点を捨てる。近くの天井・庇よけ
    exclusion_box_enabled: true  # 既定 false: コネクタ等の自己反射を点群の段階で除去する
    exclusion_box_min_x: -0.45  # 既定 -0.60 [m]: LiDAR後方45cmの奥側
    exclusion_box_max_x: -0.00  # 既定 -0.10 [m]: LiDAR位置の手前側
    exclusion_box_min_y: -0.18  # 既定 -0.20 [m]: LiDAR右側18cm
    exclusion_box_max_y: 0.18   # 既定 0.20 [m]: LiDAR左側18cm
    exclusion_box_min_z: -0.275  # 既定 0.10 [m]: LiDAR取り付け高さから下27.5cm
    exclusion_box_max_z: 0.50   # 既定 同左 [m]: LiDAR取り付け高さから上50cm
