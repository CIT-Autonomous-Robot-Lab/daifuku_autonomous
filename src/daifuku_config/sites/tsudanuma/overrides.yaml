# 津田沼の計画用回廊地図とEMCL3Dによる自己位置推定を使う。
# PCDの取得・座標整合は daifuku_maps/maps/tsudanuma/README.md を参照。
site:
  map:
    navigation: tsudanuma/navigation/tsudanuma-challenge_nav_corridor.yaml
    localization: tsudanuma/localization/tsudanuma-challenge_loc.yaml
    pointcloud: tsudanuma/map_tsudanuma_aligned.pcd

daifuku_perception:
  pointcloud_to_laserscan:
    ros__parameters:
      max_height: 2.00  # 既定 0.50: 樹冠・庇・看板を落とす計画用の高さ帯

daifuku_navigation:
  velocity_smoother:
    ros__parameters:
      max_velocity: [1.0, 0.0, 3.14]  # 既定 [0.4, 0.0, 1.0]: 行動上限に合わせる
      min_velocity: [-1.0, 0.0, -3.14]  # 既定 [-0.4, 0.0, -1.0]: 上と対
  vi_planner:
    ros__parameters:
      map_scale: 2  # 既定 1: 内部解像度0.20mを維持
      action_names: ["forward", "back", "right", "rightfwsl", "rightfw", "left", "leftfwsl", "leftfw"]  # 既定 6手: 旋回前進を2段にした8手
      action_forward_m: [0.8, -0.4, 0.0, 0.4, 0.8, 0.0, 0.4, 0.8]  # 既定 6手: 直進0.8m、旋回前進0.4/0.8m
      action_rotation_deg: [0.0, 0.0, -45.0, -45.0, -20.0, 45.0, 45.0, 20.0]  # 既定 6手: 据え切り・低速旋回45度、高速旋回20度
      max_rollout_steps: 100000  # 既定 10000: 大域の回り込みを許す
      cost_drawing_threshold: 600  # 既定 60: 広域の表示範囲を広げる
      early_start: true  # 既定 false: 方策が接続した時点で開始する
      waypoint_prefetch: true  # 既定 false: 場を2本保持するため8GB機を前提とする
      waypoint_prefetch_threads: 2  # 既定 1: 4コア中の先読み負荷を抑える
