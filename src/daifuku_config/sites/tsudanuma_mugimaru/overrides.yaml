# tsudanuma_mugimaru.yaml — 津田沼 (mugimaru_bringup 由来、2500x1581 @0.1m
# = 250.0x158.1m) 用の上書き。地図の素性は maps/tsudanuma_mugimaru/README.md、値の由来と
# 2026-09-02 の solve 実測 (ホストは amd64 4 コア。**下の vi を書き換える前の条件**) は
# ../../README.md。
#   ros2 launch daifuku_navigation navigation.launch.py
# **地図を 2 枚に分けている唯一の場所**なので localization:=emcl2 でしか立たない
# (amcl は 2 枚目を渡す口が無く、vi は地図の購読が 1 つ)。
# **隣の tsudanuma.yaml とは別の地図** (原点も解像度も違うのでウェイポイントは共用できない)。
# **未観測がほぼ無い** (0.05%) ので柵になるのは描かれた壁だけ — 範囲を絞るのは
# navigation の地図に壁を描くほう。
# **2026-09-03 の実機で初走行し、その場で回り続けた (スピン)。** greedy へ戻すのと据え切りを
# ∓60 → ∓40 へ下げるのを**同時に**やったので、直ってもどちらが効いたかは分からない。
# 共通設定と異なる値だけを指定する。

# ── 地図 (ノードのパラメータではない) ─────────────────────────────────────
# **どちらも free_thresh 0.2 で、未観測画素 205 が nav 28 / loc 25 セルぶん空きへ化ける**
# (tools/maps/verify_map_thresholds.py が NG を出す)。気になるなら地図側を 0.15 へ。
site:
  map:
    navigation:   tsudanuma_mugimaru/navigation/tsudanuma-challenge_nav_corridor.yaml  # 経路計画 (/map)。手描きの壁 + 順路から 8.5m の回廊だけ。**順路を変えたら作り直すこと**
    localization: tsudanuma_mugimaru/localization/tsudanuma-challenge_loc.yaml  # 自己位置推定 (/map_loc)。実測のまま

daifuku_perception:
  # ── スキャンの切り出し ────────────────────────────────────────────────────
  # 仰角 0.0 なので全距離で 0.275-2.00m 固定 (tsudanuma.yaml は 2.50 で、こちらだけ低い)。
  # 対角が 296m あるので emcl2 は range_max を使い切る。
  pointcloud_to_laserscan:
    ros__parameters:
      max_height: 2.00                # 断片 0.50: 樹冠・庇・看板を落とす (tsudanuma.yaml は 2.50)

  # ── emcl2 ────────────────────────────────────────────────────────────────
  # **emcl2 が読むのは localization の地図**で、手描きの壁はそちらに無いので 19F のような
  # 貫通は起きにくいはず。他の 2 地図から写してあるのは屋外で観測が疎になる区間のため。
  # **貫通が出ないと分かったら断片 (0.5 / 0.2) へ戻すこと。**
daifuku_localization:
  emcl2:
    ros__parameters:
      alpha_threshold: 0.2                # 断片 0.5: 他の 2 地図と同じ値。0 ではないので膨張リセットは起きる
      expansion_radius_orientation: 0.05  # 断片 0.2: リセット時の姿勢の飛びを抑える

  # ── cmd_vel の頭打ち ──────────────────────────────────────────────────────
daifuku_navigation:
  velocity_smoother:
    ros__parameters:
      max_velocity: [1.0, 0.0, 3.14]     # 断片 [0.4, 0.0, 1.0]: 並進・旋回の上限を広げる
      min_velocity: [-1.0, 0.0, -3.14]   # 断片 [-0.4, 0.0, -1.0]: 上と対

  # ── 価値反復プランナ ──────────────────────────────────────────────────────
  # **地図が元から 0.1m/cell なので map_scale の効き方が他の 2 つと違う** (scale 2 =
  # 0.20m/cell で tsudanuma の scale 5 とほぼ同規模)。**scale 3 へは上げないこと** —
  # 通路のセル幅が死ぬ上限が 0.25m/cell 付近。
  # action_names / _forward_m / _rotation_deg は**同じ長さでないと起動時に落ちる**。
  vi_planner:
    ros__parameters:
      map_scale: 2                         # 既定 1: 内部だけ 0.20m/cell (5925 万状態)。**上げても solve は速くならない** (scale 3 は状態数 44% でフル solve 27.72s、scale 2 は 27.95s。1 手が跨ぐセルが減って反復が増え相殺する)。減るのは sink だけ (0.71 -> 0.32GB)
      action_names: ["forward", "back", "right", "rightfwsl", "rightfw", "left", "leftfwsl", "leftfw"]  # 既定 6 手: この地図だけの 8 手 (tsudanuma.yaml とは並びも値も違う。未検証)
      action_forward_m: [0.8, -0.4, 0.0, 0.4, 0.8, 0.0, 0.4, 0.8]  # 断片 6 手: 直進0.8m、旋回前進0.4/0.8m
      action_rotation_deg: [0.0, 0.0, -45.0, -45.0, -20.0, 45.0, 45.0, 20.0]  # 断片 6 手: 据え切り・低速旋回45度、高速旋回20度
      goal_margin_radius: 1.0              # 断片 0.5 [m]: 到達判定を5セル分に広げる
      max_rollout_steps: 100000            # 断片 10000: 対角 296m ÷ 1.0m ≒ 296 手だが、回り込むと桁が足りない
      cost_drawing_threshold: 600          # 断片 60: 表示専用。色スケール上限 [ステップ≒秒] ≒600m (未計測)
      early_start: true                    # 断片 false: 方策が繋がった時点で計算を打ち切る
      waypoint_prefetch: true              # 断片 false: いまの点へ走っている間に次を解く (2026-09-02)。**効くことは実測済み** (2 点目は先読みから 0.04s で採用。1 手 0.8m の頃)。**1 点目は必ず待つ。** 場が 2 本で sink 711MB x2 = 1.42GB + 1 コア — **Pi 5 (8GB) 前提**。**ノードのメモリ判定は 1 本ぶんしか見ない**ので 4GB 機では黙って OOM になる。走行中の固まりが出たら真っ先にここを疑う
      waypoint_prefetch_threads: 2         # 既定 1: 既定の 1 スレッドだと本体のコア数の恩恵を受けない (回廊地図でフル solve 13.07s に対し先読み 51.01s、2 で 32.44s = 走行 89.85s の 1/2.8)。代償は 1 点目が 0.5 秒ほど伸びること。**Pi 5 の 4 コアで 3 以上にしないこと**。**秒数はどれも 1 手 0.8m・作り直し前の回廊地図の実測で、要再測**
