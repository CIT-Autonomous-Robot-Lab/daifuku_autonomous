# 提供された2026地図を使う。2025や旧GLIM地図の順路は共用しない。
# navigation.tsukuba2026.launch.py は EMCL3D を既定とし、計画用スキャンを分離する。
site:
  map:
    navigation: tsukuba2026/tsukuba2026_modified.yaml  # /map: 提供された編集済み地図
    localization: tsukuba2026/tsukuba2026.yaml  # /map_loc: 提供された元地図
    pointcloud: tsukuba2026/tsukuba2026.pcd

daifuku_localization:
  emcl2:
    ros__parameters:
      base_frame_id: localization_gravity       # Same frame as the localization projection.
      footprint_frame_id: localization_gravity  # Colocated with base_footprint.
      laser_likelihood_max_dist: 0.2            # 既定 1.0: 元地図の4セル分の壁面支持
      alpha_threshold: 0.0                     # Match the upward-ray pipeline used in 2025.
      odom_fw_dev_per_fw: 0.01                  # Initial profile from 2025; not field-tuned.
      odom_rot_dev_per_fw: 0.01                 # Initial profile from 2025; not field-tuned.
      odom_rot_dev_per_rot: 0.01                # Initial profile from 2025; not field-tuned.
daifuku_navigation:
  vi_planner:
    ros__parameters:
      map_scale: 5  # 既定 1: 0.05mの提供地図を内部0.25mで使う
      action_names: ["forward", "back", "right", "rightfwsl", "rightfw", "left", "leftfwsl", "leftfw"]  # 既定 6手: mugimaruと同じ8手
      action_forward_m: [0.8, -0.4, 0.0, 0.4, 0.8, 0.0, 0.4, 0.8]  # 既定 6手: mugimaruの並進量
      action_rotation_deg: [0.0, 0.0, -45.0, -45.0, -20.0, 45.0, 45.0, 20.0]  # 既定 6手: mugimaruの旋回量
      goal_margin_radius: 1.0  # 既定 0.5: mugimaruの到達半径
      max_rollout_steps: 100000  # 既定 10000: 大域の回り込みを許す
      cost_drawing_threshold: 600  # 既定 60: mugimaruの表示範囲
      early_start: true  # 既定 false: 方策が接続した時点で開始する
      waypoint_prefetch: true  # 既定 false: mugimaru同様8GB機を前提とする
      waypoint_prefetch_threads: 2  # 既定 1: 4コア中の先読み負荷を抑える
  velocity_smoother:
    ros__parameters:
      max_velocity: [0.8, 0.0, 1.0]              # Same upper limits as the 2025 profile.
