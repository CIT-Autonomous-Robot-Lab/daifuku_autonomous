# 共通VI設定。場所別調整は ../sites/、詳細は ../README.md。
# 「既定」はノード宣言値。コメント化した項目は既定値の参照用。
vi_planner:
  ros__parameters:
    use_sim_time: false

    # 計算と障害物
    solver: "frontier2d_sparse_compact"  # 既定 frontier2d_sparse: 省メモリ版
    compact_ram_limit_mb: 4096    # 既定 0 [MB]: RAM上限。compact_sink_dir指定時は無効
    theta_cell_num: 60           # 既定 60: 姿勢分割数。360の約数にする
    safety_radius: 0.4           # 既定 0.2 [m]: 障害物との余裕
    safety_radius_penalty: 10000    # 既定 30 [秒/セル]: 障害物近傍の通過コスト
    goal_margin_radius: 0.5      # 既定 0.3 [m]: 到達判定の距離許容差
    goal_margin_theta: 20.0      # 既定 15.0 [deg]: 到達判定の角度許容差
    map_wait_sec: 60             # 既定 30 [s]: 地図の到着待ち
    vi_threads: 0               # 既定 0: 論理コア数を使用
    unknown_as_obstacle: true    # 既定 true: 未観測を障害物とする
    # map_scale: 1               # 既定 1: 内部地図の縮小倍率
    # downsample_policy: "conservative"  # 既定 conservative: 障害物優先の縮小
    # compact_sink_dir: ""       # 既定 "": 自動選択。指定時はRAM上限より優先

    # 経路と追従
    max_rollout_steps: 10000     # 既定 10000: 経路生成の最大手数
    path_spacing: 0.05           # 既定 0.05 [m]: 出力経路の補間間隔
    control_frequency: 10.0      # 既定 10.0 [Hz]: 指令・入力処理の周期。局所計算の周期ではない
    scan_penalty_radius: 0.4     # 既定 0.1 [m]: スキャン障害物のペナルティ帯半幅
    local_cpu_share: 0.6         # 既定 0.6: 1コア基準の局所計算CPU秒/実時間秒
    no_action_timeout_sec: 3.0   # 既定 3.0 [s]: 姿勢・方策がないときの中断時間
    local_shape: "capsule"       # 既定 square: 進行方向に沿うカプセル形
    local_xy_range: 2.5          # 既定 1.0 [m]: 追従窓の前後半径
    local_xy_range_lat: 2.0      # 既定 0.0 [m]: 追従窓の横半径
    local_shape_ratio_max: 1.25  # 既定 1.5: 前後半軸の伸縮倍率上限
    # local_shape_slew_per_sec: 1.0  # 既定 1.0 [m/s]: 追従窓の変形速度上限
    # follow_controller: "greedy"  # 既定 greedy: greedy/dwa/mppi
    # dwa_horizon_s: 1.0         # 既定 1.0 [s]: DWA・MPPIの予測時間
    # dwa_lethal_penalty: 0.0    # 既定 0.0: DWAの障害物帯棄却閾値
    # mppi_samples: 256          # 既定 256: MPPIのサンプル数

    # 巡回と背景計算
    goal_retry_limit: 3          # 既定 3: 失敗時の再試行上限
    stop_on_failure: false       # 既定 false: 失敗した点を飛ばして続行
    global_sweep: true           # 既定 true: 局所の変更を全域へ伝播
    global_cpu_share: 0.2        # 既定 0.2: 1コア基準の全域伝播CPU秒/実時間秒
    waypoint_prefetch: false     # 既定 false: 次点の先読み。4GB機では無効にする
    # waypoint_topic: "waypoints"  # 既定 waypoints: 先読み対象の順路
    # waypoint_prefetch_threads: 1  # 既定 1: compact先読みのスレッド数
    early_start: false           # 既定 false: 方策が繋がれば走り出し、残りは背景計算

    # 表示
    value_publish_interval_ms: 500  # 既定 500 [ms]: 負で非表示、0で収束時のみ配信
    cost_drawing_threshold: 60   # 既定 60: コスト表示の上限

    # 行動配列の長さとvelocity_smootherの上限を揃える。
    action_names: ["forward", "back", "right", "rightfw", "left", "leftfw"]  # 既定 同左
    action_forward_m: [0.5, -0.2, 0.0, 0.5, 0.0, 0.5]  # 既定 [0.3, -0.2, 0, 0.2, 0, 0.2] [m]: 前進量
    action_rotation_deg: [0.0, 0.0, -30.0, -30.0, 30.0, 30.0]  # 既定 [0, 0, -20, -20, 20, 20] [deg]: 回転量
    localizer: "external"        # 既定 external: 外部の自己位置推定を使用

    # 内蔵推定器用。externalでは不要。
    # belief_radius: 2.0         # 既定 2.0 [m]: grid/adaptiveの推定窓半径
    # belief_sensor_sigma: 0.2   # 既定 0.2 [m]: 観測ノイズ
    # belief_beam_step: 10       # 既定 10: 観測ビームの間引き幅
    # belief_max_range: 25.0     # 既定 25.0 [m]: 観測距離上限
    # belief_motion_sigma_xy: 0.03  # 既定 0.03 [m]: 並進ノイズ
    # belief_motion_sigma_theta_deg: 2.0  # 既定 2.0 [deg]: 回転ノイズ
    # scan_quality_gate: 0.25    # 既定 0.25: スキャン罰則を弱める品質閾値
    # sigma_margin_gain: 0.0     # 既定 0.0: 推定分散による余裕の拡大率
    # map_clear_from_scan: false  # 既定 false: ビーム通過域の地図障害物を除去
    # qmdp: false                # 既定 false: 多峰の推定から行動を選択
    # active_reloc: false        # 既定 false: 能動的再定位。adaptive・密ソルバ用
    # belief_recovery: false     # 既定 false: 誘拐・追跡破綻からの復帰処理

    # launch管理。ここでは指定しない。
    # follow: true               # 既定 true: follow_pathサーバを提供
    # standalone: false          # 既定 false: 単発移動・巡回サーバを提供
    # publish_tf: false          # 既定 false: map→odomを配信
    # pose_topic: "mcl_pose"      # 既定 mcl_pose: 外部姿勢。内蔵推定では手動シード
    # scan_topic: "scan"          # 既定 scan: 入力スキャン
    # global_frame: "map"         # 既定 map: 経路の座標系
    # odom_topic: "odom"          # 既定 odom: map→odom算出用のオドメトリ
    # transform_tolerance: 0.5    # 既定 0.5 [s]: 配信TFの未来時刻幅
