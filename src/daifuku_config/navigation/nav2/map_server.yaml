# 地図の配信と保存。「既定」= nav2_map_server (humble) の map_server.cpp / map_saver.cpp。
# 合成順序と上書きは ../README.md を参照。

# **map_server は 2 つ立つ**が、節はこちら (経路計画 /map) だけ。自己位置推定側
# (map_server_loc -> /map_loc) は launch が use_sim_time と yaml_filename を直に渡す
# ——ここに map_server_loc: を足すと RewrittenYaml が yaml_filename をキー名で振り替え、
# 2 つが同じ地図になる。どちらの地図かは overrides の site: map: が決める。
map_server:
  ros__parameters:
    use_sim_time: false
    yaml_filename: ""     # 既定なし (宣言必須): 配信する地図の YAML。launch の map:= が上書きする

    # ── 未設定 (既定のまま) ──
    # topic_name: "map"   # 地図を配信するトピック名
    # frame_id: "map"     # OccupancyGrid に載せるフレーム名


map_saver:
  ros__parameters:
    use_sim_time: false
    save_map_timeout: 5.0             # 既定 2.0 [s]: /map の受信待ち上限。根拠未記録 (nav2_bringup の yaml が 5.0)
    free_thresh_default: 0.25         # 既定 0.25: これ未満の占有確率を「空き」として書き出す
    occupied_thresh_default: 0.65     # 既定 0.65: これ以上を「占有」として書き出す
    map_subscribe_transient_local: true  # 既定 true: 遅れて購読しても最後の /map を受け取る QoS
