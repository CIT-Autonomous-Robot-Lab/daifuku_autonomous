# tsudanuma_mugimaru.yaml — 津田沼 (mugimaru_bringup 由来、2500x1581 @0.1m
# = 250.0x158.1m) 用の上書き。地図の素性は maps/tsudanuma_mugimaru/README.md、
# 値の由来と 2026-09-02 の solve 実測 (ホストは amd64 4 コア。Pi 5 の値ではない) は ../README.md。
#   ros2 launch daifuku_stack navigation.launch.py planner:=vi local_planner:=vi
# **地図を 2 枚に分けている唯一の場所**なので localization:=emcl2 でしか立たない
# (amcl は 2 枚目を渡す口が無く、vi は地図の購読が 1 つ)。
# **隣の tsudanuma.yaml とは別の地図** (原点も解像度も違うのでウェイポイントは共用できない)。
# **未観測がほぼ無い** (0.05%) ので、柵になるのは描かれた壁だけ — track_unknown_space も
# unknown_as_obstacle も効かない。範囲を絞るのは navigation の地図に壁を描くほう。
# **実機ではまだ通していない。** 値は tsudanuma.yaml から写し、内部解像度で決まるものだけ
# 計算し直してある。3 ファイルでキーの集合をそろえてある (例外は 19F の内蔵推定器 4 つ)。

# ── 地図 (ノードのパラメータではない) ─────────────────────────────────────
# **どちらも free_thresh 0.2 で、未観測画素 205 が nav 28 / loc 25 セルぶん空きへ化ける**
# (simulator/tests/verify_map_thresholds.py が NG を出す)。気になるなら地図側を 0.15 へ。
site:
  map:
    navigation:   tsudanuma_mugimaru/navigation/tsudanuma-challenge_nav_corridor.yaml  # 経路計画 (/map)。手描きの壁 + 順路から 5m の回廊だけ。**順路を変えたら作り直すこと**
    localization: tsudanuma_mugimaru/localization/tsudanuma-challenge_loc.yaml  # 自己位置推定 (/map_loc)。実測のまま

daifuku_stack:
  # ── 仰角フィルタ ──────────────────────────────────────────────────────────
  # 場所は tsudanuma.yaml と同じなので同じ切り方。戻すなら 5.0 から (max_height と対)。
  elevation_filter:
    ros__parameters:
      min_elevation_deg: 0.0          # 断片同値: 搭載高の水平面。勾配対策は無し

  # ── スキャンの切り出し ────────────────────────────────────────────────────
  # tsudanuma.yaml と同じ帯。仰角 0.0 なので全距離で 0.275-2.50m 固定。
  # 対角が 296m あるので emcl2 は range_max を使い切る。
  pointcloud_to_laserscan:
    ros__parameters:
      min_height: 0.275               # 断片同値: 搭載高 (2026-08-03 実測)。下げると床が載る
      max_height: 2.50                # 断片 0.50: 樹冠・庇・看板を落とす (tsudanuma.yaml と同じ)
      range_max: 70.0                 # 断片同値: センサの測距上限 (反射率 80% で 70m)

  # ── emcl2 ────────────────────────────────────────────────────────────────
  # **emcl2 が読むのは localization の地図**で、手描きの壁はそちらに無いので 19F のような
  # 貫通は起きにくいはず。他の 2 地図から写してあるのは屋外で観測が疎になる区間のため。
  # **貫通が出ないと分かったら断片 (0.5 / 0.2) へ戻すこと。**
  emcl2:
    ros__parameters:
      alpha_threshold: 0.2                # 断片 0.5: 他の 2 地図と同じ値。0 ではないので膨張リセットは起きる
      expansion_radius_orientation: 0.05  # 断片 0.2: リセット時の姿勢の飛びを抑える

  # ── cmd_vel の頭打ち ──────────────────────────────────────────────────────
  velocity_smoother:
    ros__parameters:
      max_velocity: [1.0, 0.0, 2.5]     # 断片 [0.4, 0.0, 1.0]: tsudanuma.yaml と同じ屋外の頭 (実速度は action_forward_m が決める)
      min_velocity: [-1.0, 0.0, -2.5]   # 断片 [-0.4, 0.0, -1.0]: 上と対

  # ── 価値反復プランナ ──────────────────────────────────────────────────────
  # **地図が元から 0.1m/cell なので map_scale の効き方が他の 2 つと違う** (scale 2 =
  # 0.20m/cell で tsudanuma の scale 5 とほぼ同規模)。**scale 3 へは上げないこと** —
  # 通路のセル幅が死ぬ上限が 0.25m/cell 付近。
  # action_names / _forward_m / _rotation_deg は**同じ長さでないと起動時に落ちる**。
  vi_planner:
    ros__parameters:
      solver: "frontier2d_sparse_compact"  # 断片同値: 密だと 3.3GB 見当で tsudanuma と同じく OOM 圏。明示する
      map_scale: 2                         # 既定 1: 内部だけ 0.20m/cell (5925 万状態)。**上げても solve は速くならない** (scale 3 は状態数 44% でフル solve 27.72s、scale 2 は 27.95s。1 手が跨ぐセルが減って反復が増え相殺する)。減るのは sink だけ (0.71 -> 0.32GB)
      downsample_policy: "conservative"    # 既定同値: 2 倍なら通路は片側 0.1m しか細らない (楽観が要るのは 0.25m/cell から)
      action_names: ["forward", "back", "right", "rightfw", "rightfwsl", "left", "leftfw", "leftfwsl"]  # 既定 6 手: tsudanuma.yaml から写した 8 手 (未検証)
      action_forward_m: [0.8, -0.2, 0.0, 0.8, 0.4, 0.0, 0.8, 0.4]  # 断片 6 つ [0.5, -0.2, 0.0, 0.5, 0.0, 0.5]: 上限は velocity_smoother の 1.0m/s
      action_rotation_deg: [0.0, 0.0, -30.0, -20.0, -30.0, 30.0, 20.0, 30.0]  # 断片 6 つ: 速い側 ±20 度 (0.8m で半径 2.29m)、遅い側 ±30 度 (0.4m で 0.76m)
      goal_margin_radius: 0.75             # 断片 0.3 [m]: tsudanuma.yaml と同じ許容差。**そろえてあるのはメートルでセル数ではない** (0.20m/cell では 3.75 セル)
      safety_radius_penalty: 5             # 断片 30: tsudanuma.yaml と同じ。30 だと貪欲ロールアウトが降下できない (未検証)
      max_rollout_steps: 100000            # 断片 10000: 対角 296m ÷ 0.8m ≒ 370 手だが、回り込むと桁が足りない
      cost_drawing_threshold: 600          # 断片 60: 表示専用。色スケール上限 [ステップ≒秒] ≒480m (未計測)
      early_start: true                    # 断片 false: 方策が繋がった時点で solve を打ち切る。値バンド 80 ステップ < 値域 370 ステップなので隙は残る (未検証)
      waypoint_prefetch: true              # 断片 false: いまの点へ走っている間に次を解く (2026-09-02)。**効くことは実測済み** (2 点目は先読みから 0.04s で採用)。**1 点目は必ず待つ。** 場が 2 本で sink 711MB x2 = 1.42GB + 1 コア — **Pi 5 (8GB) 前提**、4GB 機では false へ (**ノードのメモリ判定は 1 本ぶんしか見ない**ので黙って OOM になる)。走行中の固まりが出たら真っ先にここを疑う
      waypoint_prefetch_threads: 2         # 既定 1: 先読みは既定だと 1 スレッドで本体のコア数の恩恵を受けない (回廊地図でフル solve 13.07s に対し先読み 51.01s)。2 で 32.44s = 走行 89.85s の 1/2.8 に収まる。**実機の solve が 2.8 倍まで遅くても間に合う目安。** 代償は 1 点目が 0.5 秒ほど伸びること。**Pi 5 の 4 コアで 3 以上にしないこと**
      follow_controller: "greedy"          # 既定同値: 他の 2 地図と同じ (目印として明示)

# ── ここで上書きしていないもの (いずれも未検証) ──────────────────────────────
#   costmaps.*.track_unknown_space / vi の unknown_as_obstacle … **この地図では効かない**
#     (未観測が 0.05% しか無い)。範囲を絞るのは navigation の地図に壁を描くほう。
#   compact_sink_dir … 断片のまま ("" = RAM)。sink 711MB は断片の compact_ram_limit_mb
#     (4096MB) に収まる。**4GB 機で使うなら実ディスクを指すこと** (指定すると無条件に勝つ)。
#   value_publish_interval_ms … 断片 500ms。全域スライス 98.75 万セル。途切れるなら 0 へ。
#   emcl2.laser_likelihood_max_dist … 断片の 1.0 のまま (両地図に効いている)。
