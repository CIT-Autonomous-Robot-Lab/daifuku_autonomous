# map_19f.yaml (19F、915x577 @0.05m = 45.8m x 28.9m) 用の上書き。**overrides の既定値**。
# 「断片」= 重ねる先の設定ファイルの値 (src/daifuku_config/bringup/sensors/{mid360_scan,mid360_elevation}.yaml、
# src/daifuku_config/stack/nav2/{vi_planner,behaviors}.yaml、src/daifuku_config/stack/localization/emcl2.yaml)。
# 値の由来・実測・経緯は src/daifuku_config/README.md、仰角フィルタは docs/setup/lidar.md。
#
# **map_tsudanuma.yaml とはキーの集合をそろえてある。** 片方にしか要らない値も、もう
# 片方へ断片と同じ値で書いて並べる (地図ごとの違いが縦に並んで見えるように)。だから
# 「断片も同じ値」の行は消しても挙動は変わらない。**例外は下の内蔵推定器 (VIOLA) の
# 4 つ**で、あれは津田沼には置けない (密ソルバが要り、あちらは密だと 3.17GB で OOM)。
#
# **この地図が立つ組み合わせは 1 通りだけ。** 下の localizer: belief があるので
#   tools/site.sh map_19f   # src/daifuku_config/site (既定)。機体も立て直す
#   ros2 launch daifuku_stack navigation.launch.py localization:=vi
# 以外 (既定の localization:=emcl2、planner:=navfn、local_planner:=nav2、nav2:=true) は
# どれも起動時に落ちる。map も overrides も既定なので渡さない。
#
# **1 段目はパッケージ名。** 各 launch は自分の名前の部分木しか読まない。機体側
# (daifuku_bringup:) は docker compose up で常駐しているので、変えたら
# `docker compose restart raspicat` が要る (tools/site.sh がやる)。

# ── その場所そのものに付く値 (ノードのパラメータではない) ─────────────────────
# **どの地図を読むかはここで決まる** (navigation の map:= / map_loc:= の既定。
# nav2_params.resolve_map)。値は daifuku_stack の maps/ からの相対パス (絶対パスも可)。
# **2 行とも書くこと** — 同じ地図で走らせるときも省略できない (書き忘れがもう一方の
# 地図で黙って走るのを防ぐため)。2 枚を別にできるのは localization:=emcl2 のときだけ。
site:
  map:
    navigation:   19f/map_19f.yaml   # 経路計画 (/map)。vi_planner と global_costmap
    localization: 19f/map_19f.yaml   # 自己位置推定 (/map_loc)。emcl2

daifuku_bringup:
  # ── 仰角フィルタ ──────────────────────────────────────────────────────────
  # この地図に勾配は無いので断片のまま。上げるときは max_height と組 (map_tsudanuma.yaml)。
  elevation_filter:
    ros__parameters:
      min_elevation_deg: 0.0          # 断片も同じ値: 搭載高の水平面 = 下の min_height 0.275 と同じ切り方。勾配対策は無し

  # ── スキャンの切り出し ────────────────────────────────────────────────────
  # 3 つとも断片と同じ値だが、帯も距離も場所で変わるので地図の側から見えるように明示する。
  # min/max は対で見ること (片方だけ動かすと帯が潰れてスキャンが空になる)。
  pointcloud_to_laserscan:
    ros__parameters:
      min_height: 0.275               # 断片も同じ値: 搭載高 (2026-08-03 実測)。下げると床が載る
      max_height: 0.50                # 断片も同じ値: 天井と高所の反射を捨てる
      range_max: 70.0                 # 断片も同じ値: センサ上限のまま。地図が 45.8x28.9m なので届く前に壁がある

daifuku_stack:
  # ── emcl2 ────────────────────────────────────────────────────────────────
  # 有効ビームの 28% が地図の壁を貫通する。**地図を取り直すまでの対症療法**なので、
  # 作り直したら 2 つとも消すこと。
  emcl2:
    ros__parameters:
      alpha_threshold: 0.2                # 断片 0.5 (EMCL2 既定 0.5): alpha が 0.0-0.4 に張り付くため
      expansion_radius_orientation: 0.05  # 断片 0.2 (EMCL2 既定 0.2): リセット時の姿勢の飛びを抑える

  # ── cmd_vel の頭打ち ──────────────────────────────────────────────────────
  velocity_smoother:
    ros__parameters:
      max_velocity: [0.5, 0.0, 2.5]     # 断片 [0.4, 0.0, 1.0] (ノード既定 同左): VI の 1 手 0.5m/s のクリップを外す。theta は誰も 1.0 を超えないので効かない
      min_velocity: [-0.5, 0.0, -2.5]   # 断片 [-0.4, 0.0, -1.0] (ノード既定 同左): 上と対。後退は -0.2 なので断片でもクリップされない

  # ── 価値反復プランナ ──────────────────────────────────────────────────────
  # map_scale は**プランナ内部だけ**の解像度で、/map・コストマップ・emcl2 は 0.05m のまま。
  vi_planner:
    ros__parameters:
      solver: "frontier2d_sparse"          # 断片 frontier2d_sparse_compact (ノード既定 同左 = 密): 下の active_reloc がアウトオブコアを受け付けないので密へ戻した。scale 2 で実測 655MB
      map_scale: 2                         # 既定 1 (断片は未設定): 内部だけ 0.10m/cell (794 万状態)。solve を軽くするため
      downsample_policy: "conservative"    # 既定 同左 (断片は未設定): scale 2 では通路が片側 0.05m しか細らないので保守のまま。楽観が要るのは scale >= 4 から
      action_forward_m: [0.5, -0.2, 0.0, 0.5, 0.0, 0.5]  # 断片も同じ値 (6 つとも)。これ以上は velocity_smoother の上限で頭打ち
      action_rotation_deg: [0.0, 0.0, -30.0, -30.0, 30.0, 30.0]  # 断片も同じ値 (ノード既定 ±20): 旋回半径 0.95m。±40 で回るのは津田沼だけ (2026-08-20)
      goal_margin_radius: 0.3              # 断片も同じ値 [m]: ゴール圏の半径。ゴールセル数はこれ ÷ 内部解像度なので、scale 2 (0.10m/cell) のこの地図では断片のままで足りる (津田沼は scale 5 で潰れるため 0.5)
      safety_radius_penalty: 30            # 断片も同じ値 [秒/セル]: 19F の通路幅なら 30 でも貪欲ロールアウトが降下できる (津田沼は 1 まで下げている)
      max_rollout_steps: 10000             # 断片も同じ値: 対角 54.1m ÷ 1 手 0.5m ≒ 109 手なので桁で余る (津田沼は 100000)
      cost_drawing_threshold: 100          # 断片 60: 表示専用。色スケール上限 [ステップ数≒秒] ≒50m (1 ステップ 0.5m)
      early_start: true                    # 断片 false: ゴールまで方策が繋がった時点で solve を打ち切る。密なので効く (compact の値バンドの制約が無い)。効いたかはログの cut short / truncated。**未検証**
      waypoint_prefetch: true              # 断片 false: 次の点を走行中に解いておく。点あたり 29 秒の停止が消える代わりに場が 2 本 (密なので 655MB x2 = 1.31GB) + 1 コア。**Pi 4 (4GB) では外すこと**
      follow_controller: "greedy"          # 既定 greedy (断片は未設定): dwa (場は変えず読み方だけ連続に) は 2026-08-20 の左それの切り分けで greedy へ戻した。既定と同値だが切り分けの目印として明示
      # ▲ 2026-08-09 の上流の更新で dwa は margin 帯 (penalty >= 2xPROB_BASE) を踏む
      #   候補を棄却するようになった (dwa_lethal_penalty、既定 2.0 = 有効)。壁際が通れず
      #   経路が出ないなら dwa_lethal_penalty: 0.0 で以前の挙動に戻る (どちらも未検証)。

      # ── 内蔵推定器 (VIOLA) ──────────────────────────────────────────────────
      # **この 4 つがあるあいだ、この地図は localization:=vi でしか立たない** (ヘッダ)。
      # 断片が触っていない scan_quality_gate も動き出す (external では 1.0 固定で無効、
      # 内蔵ではノード既定 0.25 が効いてスキャン注入が減衰する。**ログには出ない**)。
      # 津田沼はこの節を持たない (キーの集合をそろえる約束の例外)。**全部未検証。**
      localizer: "belief"                  # 断片 external (ノード既定 同左): 全地図に belief を持つ和積。未シードでも最初のスキャンから立ち上がる代わりに、窓が無いぶん重い (belief は VI と同じ格子 = scale 2 後の全域)
      map_clear_from_scan: true            # 既定 false (断片は未設定): ビームが貫通したセルは地図が壁と言っていても開ける。地図が古い側の不整合 (19F は有効ビームの 28% が貫通) を走行側でも凌ぐ
      qmdp: true                           # 既定 false (断片は未設定): 最尤の 1 点ではなく belief 全体で行動を選ぶ。曖昧なあいだは全仮説で無難な手に寄る
      active_reloc: true                   # 既定 false (断片は未設定): ロストしたら仮説を最も判別できる地点へ寄って戻る。**上の solver が密であることが要る**

# ── ここで上書きしていないもの ────────────────────────────────────────────
# この地図では断片 (= ほぼノード既定) のままで足りている。要るとしたら次の順で疑う。
#   emcl2.range_threshold … 貫通と見なす角度幅 [rad]。上げるほど判定が緩む。
#   emcl2.laser_likelihood_max_dist … 2026-08-09 に断片ごと 0.2 -> 1.0 (両地図に効いている)。
#     19F だけ別値にしたくなったらここへ足す。理屈は src/daifuku_config/README.md。
#   costmaps.*.inflation_radius … 通路幅が足りず経路が出ないとき。外接円 0.408m を下回らせない。
#   vi_planner.safety_radius_penalty / downsample_policy … 上に断片と同値で書いてある
#     (津田沼との差を縦に並べるため)。動かすのは通路が細くて貪欲ロールアウトが固着する
#     とき / 波がゴール近傍で止まるとき。
#   vi_planner.compact_sink_dir … この地図は密なので効かない (compact 専用)。
