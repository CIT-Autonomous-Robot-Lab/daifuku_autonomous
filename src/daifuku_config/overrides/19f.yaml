# 19f.yaml — 19F (915x577 @0.05m = 45.8x28.9m) 用の上書き。
# 「断片」= 重ねる先の設定ファイルの値 (stack/sensors/, stack/nav2/, stack/localization/)。
# 値の由来・実測・経緯は ../README.md、仰角フィルタは docs/setup/lidar.md。
# **立つのは 1 通りだけ** (下の localizer: belief のため):
#   ros2 launch daifuku_stack navigation.launch.py localization:=vi
# **3 ファイルはキーの集合をそろえてある** (「断片同値」の行は消しても挙動は変わらない)。
# 例外は 2 つ — 内蔵推定器の 4 つは密ソルバが要るので津田沼に置けない、8 手の行動は
# 津田沼の 2 地図だけ (屋内で 1 手 0.8m は曲がりきれない見込み。未検証)。

# ── 地図 (ノードのパラメータではない) ─────────────────────────────────────
# navigation の map:= / map_loc:= の既定。maps/ からの相対パス。**2 行とも書くこと**。
site:
  map:
    navigation:   19f/map_19f.yaml   # 経路計画 (/map)。vi_planner と global_costmap
    localization: 19f/map_19f.yaml   # 自己位置推定 (/map_loc)。emcl2

daifuku_stack:
  # ── 仰角フィルタ ──────────────────────────────────────────────────────────
  elevation_filter:
    ros__parameters:
      min_elevation_deg: 0.0          # 断片同値: 搭載高の水平面。この地図に勾配は無い

  # ── スキャンの切り出し ────────────────────────────────────────────────────
  # 帯も距離も場所で変わるので断片と同値でも明示する。min/max は対 (片方だけ動かすと潰れる)。
  pointcloud_to_laserscan:
    ros__parameters:
      min_height: 0.275               # 断片同値: 搭載高 (2026-08-03 実測)。下げると床が載る
      max_height: 0.50                # 断片同値: 天井と高所の反射を捨てる
      range_max: 70.0                 # 断片同値: センサ上限。届く前に壁がある

  # ── emcl2 ────────────────────────────────────────────────────────────────
  # 有効ビームの 28% が地図の壁を貫通する。**地図を取り直したら 2 つとも消すこと**。
  emcl2:
    ros__parameters:
      alpha_threshold: 0.2                # 断片 0.5: alpha が 0.0-0.4 に張り付くため
      expansion_radius_orientation: 0.05  # 断片 0.2: リセット時の姿勢の飛びを抑える

  # ── cmd_vel の頭打ち ──────────────────────────────────────────────────────
  velocity_smoother:
    ros__parameters:
      max_velocity: [0.5, 0.0, 2.5]     # 断片 [0.4, 0.0, 1.0]: VI の 1 手 0.5m/s のクリップを外す
      min_velocity: [-0.5, 0.0, -2.5]   # 断片 [-0.4, 0.0, -1.0]: 上と対

  # ── 価値反復プランナ ──────────────────────────────────────────────────────
  # map_scale は**プランナ内部だけ**の解像度 (/map・コストマップ・emcl2 は 0.05m のまま)。
  vi_planner:
    ros__parameters:
      solver: "frontier2d_sparse"          # 断片 frontier2d_sparse_compact: 下の active_reloc がアウトオブコアを受け付けない。scale 2 で 655MB (実測)
      map_scale: 2                         # 既定 1: 内部だけ 0.10m/cell (794 万状態)。solve を軽くするため
      downsample_policy: "conservative"    # 既定同値: scale 2 なら通路は片側 0.05m しか細らない (楽観が要るのは scale >= 4)
      action_forward_m: [0.5, -0.2, 0.0, 0.5, 0.0, 0.5]  # 断片同値 (6 手)。これ以上は velocity_smoother の上限で頭打ち
      action_rotation_deg: [0.0, 0.0, -30.0, -30.0, 30.0, 30.0]  # 断片同値: 旋回半径 0.95m
      goal_margin_radius: 0.3              # 断片同値 [m]: ゴール圏 ÷ 0.10m/cell = 3 セル
      safety_radius_penalty: 30            # 断片同値 [秒/セル]: 19F の通路幅なら貪欲ロールアウトが降下できる
      max_rollout_steps: 10000             # 断片同値: 対角 54.1m ÷ 0.5m ≒ 109 手なので桁で余る
      cost_drawing_threshold: 100          # 断片 60: 表示専用。色スケール上限 [ステップ≒秒] ≒50m
      early_start: true                    # 断片 false: 方策が繋がった時点で solve を打ち切る。密なので効く。ログの cut short / truncated で見る (未検証)
      waypoint_prefetch: true              # 断片 false: 点あたり 29 秒の停止が消える代わりに場が 2 本 (655MB x2 = 1.31GB) + 1 コア。**Pi 4 (4GB) では外すこと**
      follow_controller: "greedy"          # 既定同値: dwa は 2026-08-20 の左それの切り分けで戻した (目印として明示)。壁際が通れないなら dwa_lethal_penalty: 0.0

      # ── 内蔵推定器 (VIOLA) ──────────────────────────────────────────────────
      # **この 4 つがあるあいだ localization:=vi でしか立たない。全部未検証。**
      localizer: "belief"                  # 断片 external: 全地図に belief を持つ和積。未シードでも立ち上がる代わりに重い。scan_quality_gate (ノード既定 0.25) も効き出す
      map_clear_from_scan: true            # 既定 false: 貫通したセルは地図が壁と言っていても開ける (28% 貫通を走行側でも凌ぐ)
      qmdp: true                           # 既定 false: 最尤の 1 点ではなく belief 全体で行動を選ぶ
      active_reloc: true                   # 既定 false: ロストしたら判別できる地点へ寄って戻る。**上の solver が密であることが要る**

# ── ここで上書きしていないもの (要るとしたらこの順で疑う) ────────────────────
#   emcl2.range_threshold … 貫通と見なす角度幅 [rad]。上げるほど緩む。
#   emcl2.laser_likelihood_max_dist … 断片の 1.0 (両地図に効いている)。
#   costmaps.*.inflation_radius … 経路が出ないとき。外接円 0.408m を下回らせない。
#   vi_planner.compact_sink_dir … この地図は密なので効かない (compact 専用)。
