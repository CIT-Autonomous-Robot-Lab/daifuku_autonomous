# LiDAR の角度フィルタ (laser_filters の LaserScanSectorFilter)。
# scan_pipeline.launch.py が scan_filter_params_file でノードへ直接渡す。
#
# このフィルタに**既定値は無い**。sector_filter.h の configure() は 6 つすべてを
# getParam で要求し、1 つでも欠けると ERROR を出して設定失敗になる (上流 example の
# yaml のコメントは既定値があるように書いているが、コードにはその分岐が無い)。
# 未設定キーも無い (下の 6 つで全部)。

scan_to_scan_filter_chain:
  ros__parameters:
    filter1:
      name: connector_blind_sector       # チェーン内でのこのフィルタの名前 (任意)
      type: laser_filters/LaserScanSectorFilter   # 適用するフィルタのクラス
      params:
        # 後方 50 度 (+155 度から ±180 度をまたいで -155 度まで) を除外する。
        # この機体は後方にコネクタがあり、自分自身を障害物として拾うため。
        # angle_max < angle_min は「±180 度をまたぐ扇形」を意味する意図的な指定。
        angle_min: 2.705260341           # [rad] 扇形の始端 (+155 度)
        angle_max: -2.705260341          # [rad] 扇形の終端 (-155 度)
        range_min: 0.0                   # [m] 扇形として扱う距離の下限
        range_max: 100.0                 # [m] 同上限。実質すべての距離が対象
        clear_inside: true               # true = 扇形の内側を消す (false なら外側)
        invert: false                    # clear_inside の反転指定 (= !clear_inside)
