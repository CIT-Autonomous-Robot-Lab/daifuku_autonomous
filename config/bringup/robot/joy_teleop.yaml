# ゲームパッド (XInput 互換) での手動走行。robot_bringup.launch.py が
# joy_teleop_params_file で joy_node と joy_teleop の両方へ渡す
# (joy:=false なら立てない)。1 つのファイルに 2 ノード分入っているのは、
# 節の名前でノードを選り分けるので混ざらないため。
#
# 「既定」= joy_node は upstream joy パッケージ、joy_teleop は
# src/joy_teleop.py の declare_parameter の値。
#
# ボタンと軸の番号は **XInput (X モード)** のときのもの。DirectInput 側にすると総
# 入れ替えになるので、合わなければ `ros2 topic echo /joy` で押しながら確かめて直すこと
# (番号違いは**エラーにならず、ただ効かない**)。
#
# 速度域と操作の意味は ../../../../docs/usage/joystick.md。

joy_node:
  ros__parameters:
    device_id: 0            # 既定 0: /dev/input の何番目のゲームパッドか。複数挿すときだけ変える
    deadzone: 0.0           # 既定 0.05: 不感帯は joy_teleop 側だけに持たせる。ここで切ると軸の値が引き伸ばされて届き、二重に効く
    autorepeat_rate: 20.0   # 既定 20.0 [Hz]: 変化が無くても再送する周期。**0 にしないこと** — 傾けたまま保持すると /joy が止まって機体が止まる
    sticky_buttons: false   # 既定 false: 押すたびに ON/OFF が入れ替わる操作にするか。長押し判定が壊れるので false のまま

joy_teleop:
  ros__parameters:
    axis_linear: 1          # 既定 1: 前後に使う軸 (左スティックの上下)。上が前進
    axis_angular: 0         # 既定 0: 旋回に使う軸 (左スティックの左右)。左が左旋回
    deadzone: 0.15          # 既定 同左: この傾き以下は 0。超えたところで min_speed に飛ぶ

    linear_min_speed: 0.1   # 既定 同左 [m/s]: 不感帯を出た直後の速さ。ステップ 91 Hz 相当で、0 に丸められる min_step_frequency (5 Hz) には遠い
    linear_max_speed: 0.35  # 既定 同左 [m/s]: 目一杯倒したときの速さ
    linear_boost_speed: 0.8 # 既定 同左 [m/s]: button_boost を押しているときの上限。ステップ 726 Hz 相当 (max_step_frequency 10000 には遠い)
    angular_min_speed: 0.3  # 既定 同左 [rad/s]: 旋回の下限。並進と同じ考え方
    angular_max_speed: 1.0  # 既定 同左 [rad/s]: 旋回の上限
    angular_boost_speed: 1.0 # 既定 1.5 [rad/s]: ブースト時の旋回の上限。angular_max_speed と同値なので、**RB を押しても旋回は変わらない** (上がるのは並進だけ)

    # 加減速。ドライバは受けた速度をそのままステップ周波数にするので、段差の
    # ある指令は**エラーを出さずに脱調**する (指令より遅く・左右バラバラに回る)。
    # 並進は加速と減速を同値にしてある (ノード既定は減速が 2 倍で、そちらは
    # 止まるのが遅いのを安全側でないとみた値)。0 以下でその側の制限を外せる。
    linear_accel: 1.0       # 既定 0.9 [m/s^2]: 0 -> 0.8 に 0.80 秒。**上げすぎると脱調する** (指令より遅く・左右バラバラに回るだけでエラーは出ない)
    linear_decel: 1.0       # 既定 1.8 [m/s^2]: 0.8 -> 0 に 0.80 秒 = 0.32 m。**/joy が途切れたときの停止距離もこれ** (既定 1.8 では 0.18 m)
    angular_accel: 6.0      # 既定 同左 [rad/s^2]: 0 -> 1.0 に 0.17 秒。並進より強くしてよいのは、旋回 1.0 rad/s が車輪では 159 Hz 相当 (0.8 m/s の 726 Hz より軽い) ため
    angular_decel: 12.0     # 既定 同左 [rad/s^2]: 1.0 -> 0 に 0.083 秒。publish_rate 20 Hz では 2 刻みで降りるので、**これ以上上げても刻みが粗くなるだけ** (段差に近づく)

    button_toggle: 7        # 既定 7: START。hold_seconds 長押しで teleop の入/切
    button_waypoints: 6     # 既定 6: BACK。単体で長押しして離すとモータ電源の入/切、START と同時ならウェイポイント巡回を開始
    button_boost: 5         # 既定 5: RB。押しているあいだだけ上限が boost 側になる
    hold_seconds: 2.0       # 既定 同左 [s]: 長押しと判定するまでの時間。BACK 単体だけはこれを超えて「離した」時点で成立する

    publish_rate: 20.0      # 既定 同左 [Hz]: /cmd_vel_teleop を出す周期。twist_mux の timeout 0.5 s より十分速く
    joy_timeout: 0.5        # 既定 同左 [s]: /joy がこれだけ途切れたら受信断とみなしてゼロを出す
    stop_tail: 1.0          # 既定 同左 [s]: teleop を切ったあとゼロを出し続ける時間。黙るだけだとドライバが最後の速度を保持する。linear_decel で降りきるまでは別途待つので、ここを縮めても途中で黙りはしない
    cancel_window: 2.0      # 既定 同左 [s]: teleop に入ったあと取り消しを出し続ける時間。1 回では waypoint_follower が次の点へ出し直す分を拾えない
    start_enabled: false    # 既定 false: 起動直後から teleop 入にするか。true にすると挿しただけで自律側を塞ぐ
    buzzer: true            # 既定 同左: モードが切り替わったとき /buzzer へ短い旋律を出すか。旋律は src/joy_buttons.py の TUNE_*
    leds: true              # 既定 同左: いまのモードを /leds へ映すか。led0=teleop 入 / led1=モータ電源 (要求の写しなので外から変えるとずれる) / led2=巡回中 / led3=/joy 受信中

    waypoints_file: ""      # 既定 同左: 巡回する経路。**空なら START+BACK は断る** (既定の順路は無い)。**地図と対で選ぶこと** — 噛み合わないと全点が地図の外に出て、1 点ずつ失敗しながら最後まで進む

    follow_waypoints_action: "follow_waypoints"  # 既定 同左: 巡回のアクション名。受けるのは nav2:=false (既定) では vi_planner、nav2:=true では nav2_waypoint_follower
    navigate_to_pose_action: "navigate_to_pose"  # 既定 同左: teleop に入るときに取り消す単発ゴールのほう
    motor_power_service: "motor_power"           # 既定 同左: BACK 単体長押しで叩く本体ドライバのサービス (std_srvs/SetBool)
    motor_power_start_state: false               # 既定 同左: 起動時に電源が入っているとみなすか。ドライバの initial_motor_power と合わせる (外から変えられると 1 回ぶんずれる)
