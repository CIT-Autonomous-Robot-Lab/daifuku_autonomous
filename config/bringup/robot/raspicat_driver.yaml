# raspicat_driver (自前の本体ドライバ) のパラメータ。Pi 4 と Pi 5 で共通。
# 「既定」= src/raspicat_driver/src/raspicat_driver/node.py の declare_parameter の値。
# robot_bringup.launch.py が driver:=original のとき LifecycleNode の parameters= に直接渡す。
#
# 上流 raspicat_ros の raspimouse ノード (driver:=raspimouse、Pi 4 のみ) 用は
# raspicat.yaml。あちらは上流ファイルの完全なコピーだが、こちらは自前ノードなので
# ノード側の既定値をこの機体に合わせてあり、このファイルは全キーを既定値のまま
# 並べたものになっている (未設定キーは無い)。値の由来は ../README.md。
# I2C アドレスは 10 進で書く (YAML の 0x10 は文字列になる)。
#
# 「モータードライバ基板は正常」という前提で書いてある。use_pulse_counters は
# true (エンコーダ) が既定。ユーザ空間から I2C を叩くので、失敗しても rtmouse の
# ような D 状態固着は起きず、連続失敗で cmd_vel の積分へ自動的に落ちる。
#
# 機種差は model: auto が解決する。gpiochip_label と pwmchip_match を空にしてある
# のはそのためで、Pi 4 では pinctrl-bcm2835 / fe20c000.pwm、Pi 5 では pinctrl-rp1 /
# 98000.pwm が使われる (src/raspicat_driver/src/raspicat_driver/pi4.py・pi5.py)。

raspicat_driver:
  ros__parameters:
    model                     : "auto"  # 既定 auto: pi4 / pi5 / auto。auto は device-tree と /proc/cpuinfo から判定

    use_pulse_counters        : true    # 既定 true: I2C のパルスカウンタで odom を積む。false = cmd_vel を積分
    odometry_scale_left_wheel : 1.0     # 既定 1.0: 左車輪の回転量に掛ける補正係数
    odometry_scale_right_wheel: 1.0     # 既定 1.0: 右車輪の同上
    wheel_diameter            : 0.2     # 既定 同左 [m]: 車輪の直径 (実測 200 mm)
    wheel_tread               : 0.35    # 既定 同左 [m]: 左右車輪の間隔 (実測 350 mm)
    # 2026-08-08 に床の上で測り直した (物差しは Mid-360 が見る前方の壁)。1118 は車輪を
    # 浮かせて数えた値で、床では odom が実距離より少なく出ていた。**取りこぼしは距離では
    # なく時間に比例する**ので (odom = 0.985 x 実距離 - 0.0077 x 秒。実速度 0.13〜0.51 m/s
    # の 6 点に 0.5% で乗る)、1 つの値で全速度は合わない。下は巡航帯 0.20〜0.40 m/s に
    # 合わせた値で、そこでは +0.4%、0.13 m/s では odom が 4% 少なく出る (この向きに注意 —
    # 値を下げると odom は大きくなる)。詳細は ../../../src/raspicat_driver/README.md
    pulses_per_revolution     : 1073.0  # 既定 同左: 車輪 1 回転あたりのエンコーダのパルス数 (実測)。odom 専用
    # 570 も浮かせて数えた値で、床では指令より 27% 余計に走っていた (cmd / 実距離 =
    # 0.785)。こちらは 0.15 m/s 以上では速度によらないきれいな定数。0.10 m/s だけ
    # 0.808 と高いのは動き出しの損で、そこに合わせると巡航が速くなるので取らない。
    steps_per_revolution      : 447.0   # 既定 同左: 車輪 1 回転あたりのステップ数 (実測)。cmd_vel → 周波数専用
    odom_hz                   : 50.0    # 既定 50.0 [Hz]: odom と TF を出す周期。raspimouse の 100 から半減 (I2C の占有率を下げる)
    initial_motor_power       : false   # 既定 false: 起動時にモータ電源を入れるか
    cmd_vel_timeout           : 60.0    # 既定 60.0 [s]: cmd_vel が途切れたらモータを止めるまでの猶予
    publish_tf                : true    # 既定 true: odom -> base_footprint TF を出すか。EKF に出させるなら false
    odom_frame_id             : "odom"  # 既定 odom: odom の親フレーム
    odom_child_frame_id       : "base_footprint"  # 既定 base_footprint: odom の子フレーム
    odom_frame_prefix         : ""      # 既定 "": 上 2 つに付ける接頭辞 (複数台運用向け)

    min_step_frequency        : 5.0     # 既定 5.0 [Hz]: これ未満は 0 に丸める (rtmouse の MOTOR_UNCONTROLLABLE_FREQ と同値)
    max_step_frequency        : 10000.0 # 既定 10000.0 [Hz]: ステップ周波数の上限 (rtmouse と同値)

    # ── 速度の閉ループ ──
    # closed は「すべりと負荷」を消すためのもので、脱調には使えない。パルスの符号は
    # 直前に書いた方向線から借りるので、脱調した車輪も前進のカウントを返し、ループは
    # 遅れたと見て周波数を上げ、脱調がさらに悪化する。上限を小さく保つのはそのためで、
    # 荷重をかけて遅くなるなら (= 脱調していたら) open へ戻すこと。
    control_mode              : "closed"  # 既定 closed: closed = エンコーダで周波数を補正する。open = 指令をそのまま周波数にする (上流と同じ)。use_pulse_counters が false なら測る相手が居ないので open に落ちる (起動ログに error)
    # ゲインは 2026-08-08 に実機で測った (物差しは Mid-360 が見る前方の壁。エンコーダから
    # 独立した測り方はこれだけ)。ki は 8 で発振、4 でカウンタ自身のノイズを増幅、1〜3 は
    # どれも収束したので真ん中を取ってある。kp は 0.3 で崩れ、0.1 では何も変わらなかった。
    # 測ったのは steps_per_revolution 570 のときで、447 へ直すとループ利得が 2 割落ちて
    # 崩れる境目は ki 10 前後へ上がる (余裕が増えるほうなので詰め直しは要らない)。
    wheel_kp                  : 0.0     # 既定 0.0: 比例ゲイン。カウンタは odom_hz 3 周期に 1 度しか進まず 1 度に 12 パルス前後なので、1 周期の量子化は 0.85 rad/s ある。上げるとそれが毎周期そのまま周波数に出る
    wheel_ki                  : 2.0     # 既定 2.0 [1/s]: 積分ゲイン。積分値は「走らなかった距離」そのもので量子化が溜まらないので、補正はこちらで効かせる。時定数は 1/ki = 0.5 秒
    wheel_correction_limit    : 2.0     # 既定 2.0 [rad/s]: 補正量の上限 (車輪角速度)。0 で closed でも補正しない。指令と逆向きには回さない

    # ── 配線 (実機で確認するまでは既定のまま) ──
    gpiochip_label            : ""      # 既定 "": gpiochip をラベルで探す。空なら機種既定 (pi4: pinctrl-bcm2835 / pi5: pinctrl-rp1)
    gpiochip_device           : ""      # 既定 "": /dev/gpiochipN を直接指定する (空なら上のラベルで探す)
    gpio_direction_left       : 16      # 既定 16: 左モータの方向 (rtmouse の MOTDIR_L_BASE)
    gpio_direction_right      : 6       # 既定 6: 右モータの方向 (同 MOTDIR_R_BASE)
    gpio_motor_enable         : 5       # 既定 5: モータ電源 (同 MOTEN_BASE)
    direction_left_forward_level : 0    # 既定 0: 前進時に左方向ピンへ出す論理 (rtmouse は正周波数で clear)
    direction_right_forward_level: 1    # 既定 1: 同右 (rtmouse は正周波数で set)

    pwmchip_match             : ""      # 既定 "": /sys/class/pwm から選ぶ手がかり。空なら機種既定 (pi4: fe20c000.pwm / pi5: 98000.pwm)
    pwmchip_path              : ""      # 既定 "": /sys/class/pwm/pwmchipN を直接指定する (空なら上で探す)
    pwm_channel_left          : 0       # 既定 0: GPIO12 に出るチャネル
    pwm_channel_right         : 1       # 既定 1: GPIO13 に出るチャネル

    # ── LED・ブザー・スイッチ (実機で確認するまでは既定のまま) ──
    use_leds                  : true    # 既定 true: /leds を受けて LED を光らせる。掴めなくても走行には影響しない
    use_switches              : true    # 既定 true: /switches を出す
    use_buzzer                : true    # 既定 true: /buzzer を受けて鳴らす
    gpio_leds                 : [25, 24, 23, 18]  # 既定 同左: LED0〜3 (rtmouse の LED0_BASE〜LED3_BASE)。High で点灯
    gpio_switches             : [20, 26, 21]      # 既定 同左: SW0〜2 (同 SW1_PIN〜SW3_PIN)。押下で Low、true が押下
    gpio_buzzer               : 19      # 既定 19: ブザー (同 BUZZER_BASE)。buzzer_pwm_channel が -1 のときソフトで叩く先
    switch_pull_up            : true    # 既定 true: スイッチ線に内部プルアップを要求する。断られたら基板側のものに頼る
    switches_hz               : 10.0    # 既定 同左 [Hz]: /switches を出す周期 (raspimouse の switches_hz と同値)
    buzzer_pwm_channel        : -1      # 既定 -1: ブザーに使う PWM チャネル。-1 = ソフト生成。モータと同じ番号なら起動時にエラー
    buzzer_max_frequency      : 5000.0  # 既定 同左 [Hz]: これを超える指定は丸める (ソフト生成が CPU を食い切らない上限)

    i2c_bus                   : "/dev/i2c-1"  # 既定 同左: パルスカウンタの載っている I2C バス
    i2c_address_left          : 16      # 既定 16 (0x10): 左パルスカウンタのアドレス
    i2c_address_right         : 17      # 既定 17 (0x11): 右パルスカウンタのアドレス
    counter_error_limit       : 5       # 既定 5: I2C 読み出しが連続でこの回数失敗したら cmd_vel 積分へ落ちる
    counter_retry_period      : 1.0     # 既定 1.0 [s]: 落ちたあと再試行するまでの間隔

    allow_rtmouse             : false   # 既定 false: Pi 4 で rtmouse が載っていても起動する。両者は GPIO/PWM を奪い合うので通常は false
