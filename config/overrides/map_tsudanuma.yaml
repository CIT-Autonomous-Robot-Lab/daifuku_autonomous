# map_tsudanuma.yaml (5888x4000 @0.05m = 294.4m x 200m) 用の上書き。
# 「断片」= 重ねる先の設定ファイルの値で、
# config/bringup/sensors/{mid360_scan,mid360_elevation}.yaml、
# config/stack/nav2/vi_planner.yaml (= ノードの既定) と
# config/stack/nav2/behaviors.yaml (velocity_smoother の節)、config/stack/localization/emcl2.yaml。
#
#   tools/site.sh map_tsudanuma                    # config/site を書いて機体を立て直す
#   ros2 launch daifuku_stack navigation.launch.py planner:=vi local_planner:=vi
#   # map も overrides も config/site から来るので渡さない
#
# **1 段目はパッケージ名。** 各 launch は自分の名前の部分木しか読まない。
# 機体側 (daifuku_bringup:) は docker compose up で常駐しているので、そちらを
# 変えたときは `docker compose restart raspicat` が要る (tools/site.sh がやる)。
#
# 0.05m のまま解くと 14.1 億状態 = 密ソルバで 79GB を確保して起動と同時に死ぬ。
# プランナ内部だけ粗くし (map_scale)、密な states を確保しない compact で解くことで通す。
# 実測値・導出・既知の制約 (行動集合を変えるので value_iteration3 は ec2579d 以降が要る、
# 全域スライスが重い、pi4_sim では BT がリカバリして ABORT する) は config/README.md を参照。
#
# **overrides は置き換えなので、既定の map_19f はこのとき外れる**。この地図は 68.2% が
# 未観測で占有セルが 0.4% しかなく 19F と同じ alpha 崩壊が起きる余地があるため、
# emcl2 の 3 つは map_19f.yaml から写してあった。**2026-08-08 に alpha_threshold だけ
# 0.2 -> 0.1 へ下げたので、もう 19F と同じ値ではない** (下)。**未検証**。
#
# 確定出力 (sink 648MB) は **RAM** に置く。Pi 5 (8GB) は走行中でも空きが 5.6GB あり、
# 断片の compact_ram_limit_mb (4096MB) に収まるので自動退避も起きない。**4GB 機で使うなら
# 両ノードに compact_sink_dir を書き戻すこと** (広域側は vi_global_planner_sink)。
# 退避先は tmpfs でないこと (`findmnt -no FSTYPE <dir>`)。
#
# 2026-08-01 実測 (Pi4 相当 = 0.6 コア枠 / メモリ 3GB, VI_THREADS=3、BT を外した最小構成):
#   ソルバ単体 (bench_map): scale 3 保守 2706s / anon 2148MB、scale 5 楽観 51.9s
#   vi_planner ノード: solve + ロールアウト 87-89s / 398 姿勢 / SUCCEEDED
#                      ピーク RSS 1.60GB、sink 648MB、oom_kill 0
#   ▲ この RSS はディスク退避していた頃のもの。RAM 化した今は**未計測**。

# ── その場所そのものに付く値 (ノードのパラメータではない) ─────────────────────
# **どの地図を読むかはここで決まる。** 値は daifuku_stack の maps/ からの相対パス
# (絶対パスも可)。navigation へ map:= を渡す必要はもう無い。
site:
  map: map_tsudanuma.yaml

# ── 機体側 (docker compose up で常駐する robot_bringup.launch.py) ─────────────
# **ここを変えたら `docker compose restart raspicat` が要る。** navigation を立て直す
# だけでは変わらない (読むのは raspicat サービスなので)。
daifuku_bringup:
  # ── スキャンの切り出し ──────────────────────────────────────────────────────
  # 2026-08-05 に走行中の自己位置の飛びが出たときの対処。この地図には勾配があり、
  # **床が高さの帯へ入り込んで地図に無い壁として立つ**。以下すべて**未検証**。
  #
  # 高さで切る限りこれは直らない。帯は機体の接地面から測るので、相対傾斜 α の床は
  # min_height/tan α の先で必ず帯へ入る (下限 1.0m なら 3 度 = 5% 勾配で 19m 先)。
  # 下限と range_max を組にすれば「入る前に距離で捨てる」ことはできるが、丸ごと
  # 消せるのは atan(min_height/range_max) より緩い勾配だけで、下限を上げるほど
  # **その高さ未満の障害物が costmap から消え**、**近くが FOV から外れて丸ごと
  # 死角になる**。1.6m まで上げて 5.3% 勾配まで消せたが代償が実用域に入ったので、
  # 2026-08-05 に高さで切るのをやめて仰角で切る (elevation_filter) 形にした。
  #
  # 仰角なら**距離に比例した下限** (lidar_z + 距離 x tan(min_elevation_deg)) になり、
  # 床も天井も遠方では 0 度へ収束するので min_elevation_deg より緩い勾配は**どの距離でも
  # 入らない**。5 度 (8.7% 勾配) での実効下限は 1m 先 0.36m / 2.5m 先 0.49m / 10m 先 1.15m /
  # 30m 先 2.90m / 50m 先 4.65m / 70m 先 6.40m だった。
  #
  # **2026-08-08 に 5.0 -> 0.0 へ戻したので、いまその勾配対策は効いていない。** 0.0 度は
  # 搭載高 (lidar_z = 0.275m) の水平面そのもので、断片の min_height 0.275 と**同じ切り方**
  # = このノードは実質素通し (elevation_filter:=false と同じ帯) になる。下の max_height
  # 4.00 と合わせて、帯は**全距離で 0.275-4.00m の高さ帯**に戻った。だから勾配も
  # min_height/tan α の先で入り直し、**3 度 (5% 勾配) なら 5.2m 先、1 度でも 15.8m 先から
  # 偽の壁が立つ** (1.6m まで上げていた頃より手前で入ってくる)。emcl2 側の貫通が増える
  # 方向なので、alpha_threshold と対で見ること (下)。**未検証**。
  #
  # 戻すなら 5.0 から。5 度より急な勾配には効かない (そこは高さで切るより早く入ってくる)
  # ので、実機で偽の壁が出る距離 d を測って α = atan(1.0/d) を出し、それより上へ設定する
  # こと。近くほど低いものが見えるので、costmap (obstacle_max_range 2.5m) は高さ 1.0m 固定
  # より広く採れる。
  elevation_filter:
    ros__parameters:
      min_elevation_deg: 0.0          # 断片も同じ値: 搭載高の水平面 = 断片の min_height 0.275 と同じ切り方。勾配対策は無し

  # 下限は断片の 0.275 のまま (= 仰角 0 度と同じ切り方で重複するだけ)。ここで効かせて
  # いるのは上限だけ。
  #
  # **2026-08-08 に仰角を 0.0 へ戻したので (上)、この 3 つはもう「組」ではない。**
  # 実効下限は距離によらず 0.275m 固定なので、帯は全距離で 0.275-4.00m、**range_max の
  # 70.0 がそのまま実効の測距上限**になる (仰角 5 度の頃にあった「実効下限が max_height
  # へ達する 54.0m で帯が閉じる」は無くなった)。裏を返すと**高さ 4.0m を超えるものは
  # どの距離でも入らない**ので、樹冠・庇・看板は地図に無い壁として立たない。効かなければ
  # まず max_height を疑うこと。仰角を 5.0 へ戻すときは、下限が距離とともに上がって
  # max_height をどこに置くかが**そのまま帯の届く距離**になる関係へ戻る。
  #
  # **max_height は 2026-08-08 に 8.30 -> 5.00 -> 4.00 と 2 段下げた。未検証。**
  # 2026-08-07 に range_max を 50 -> 70 (センサ上限) へ上げ、対の max_height も
  # 6.00 -> 8.30 へ開けた結果、**高さ 6.0-8.3m のもの (樹冠・庇・看板) が全距離で新たに
  # 帯へ入る**形になっていた。emcl2 は当時この地図で alpha_threshold 0.0 / sensor_reset
  # false まで下げて凌いでいたので、貫通を増やす方向は取らずに天井を閉じたのが 5.00
  # (alpha_threshold はその後 0.1 へ戻した。下)。仰角を外して
  # 床の偽の壁が戻ったぶん (上)、さらに 4.00 まで閉じてある。戻し方は 2026-08-07 以前の
  # 6.00 + range_max 50.0 の組。
  # なお costmap は obstacle_max_range 2.5m、slam_toolbox は max_laser_range 10.0m で
  # 頭打ちなので、**この距離を実際に使うのは emcl2 だけ** (laser_max_range 未設定 =
  # 実質無制限)。
  pointcloud_to_laserscan:
    ros__parameters:
      max_height: 4.00                # 断片 0.50: 高さ 4.0m を超えるものはどの距離でも入らない。仰角 0.0 なので下限 0.275m と全距離で対
      range_max: 70.0                 # 断片も同じ値: センサの測距上限 (反射率 80% で 70m)。仰角を 0.0 へ戻したのでこれが実効

# ── 自律移動側 (人が立てる navigation / mapping) ──────────────────────────────
daifuku_stack:
  # ── emcl2 ────────────────────────────────────────────────────────────────
  # **2026-08-08 に alpha_threshold を 0.2 -> 0.1 へ下げた。** 判定は
  # `alpha_ < alpha_threshold_` (alpha は非貫通率 0.0-1.0。ExpResetMcl2.cpp) なので、
  # 19F の 0.2 より渋いだけで**膨張リセットは起きる** — 下の
  # expansion_radius_orientation と断片の expansion_radius_position 0.1 はどちらも
  # 読まれる。同じ日に仰角フィルタを外して床の偽の壁が戻った (上) ぶん貫通は増える方向
  # なので、リセットを切ってしまう 0.0 までは行かずここで止めてある。センサリセットだけは
  # 引き続き無し。**偽の壁でその場で回るのと、一度ずれたら自力で戻れないのとの折衷**で、
  # 回るようなら 0.0 へ、戻らないようなら 0.2 (19F と同じ) へ。**未検証**。
  emcl2:
    ros__parameters:
      alpha_threshold: 0.1                # 断片 0.5 (EMCL2 既定 0.5): 19F の 0.2 より渋いが 0 ではないので膨張リセットは起きる
      expansion_radius_orientation: 0.05  # 断片 0.2 (EMCL2 既定 0.2): リセット時の姿勢の飛びを抑える (expansionReset の中でしか使わない)
      sensor_reset: false                 # 断片 true (EMCL2 既定 false): 貫通粒子の引き戻しを止める

  # ── cmd_vel の頭打ち ──────────────────────────────────────────────────────
  # VI の 1 手は前進量そのものが linear.x の指令値で、この地図は 0.5m/s (下の
  # action_forward_m)。断片の velocity_smoother は DWB の max_vel_x に合わせた 0.4 なので、
  # **そのままだと 0.5 が黙って 0.4 へクリップされる** (1 手 = 1 秒で解いているのに機体は
  # それより遅く走り、旋回半径が計画より小さくなって内側を切る)。効くのは x の上限
  # だけで、**theta の 2.5 も後退側も効かない** — 角速度を出すのは VI が 20 deg/s =
  # 0.35、DWB が max_vel_theta 1.0、spin が max_rotational_vel 1.0 でどれも断片の 1.0 に
  # 届かず、後退も -0.3333 なので -0.4 でクリップされない。上下を対称に保つために
  # 対で置いてある。**2026-08-08 に追加。未検証。**
  velocity_smoother:
    ros__parameters:
      max_velocity: [0.5, 0.0, 2.5]     # 断片 [0.4, 0.0, 1.0] (ノード既定 同左): VI の 1 手 0.5m/s のクリップを外す。theta は誰も 1.0 を超えないので効かない
      min_velocity: [-0.5, 0.0, -2.5]   # 断片 [-0.4, 0.0, -1.0] (ノード既定 同左): 上と対。後退は -0.3333 なので断片でもクリップされない

  # local_planner:=vi (vi_planner 1 ノード構成) 用。以下 4 つ (map_scale /
  # downsample_policy / action_forward_m / goal_margin_radius) は**セットで効く**。1 つでも
  # 欠けると波がゴール近傍で止まり、到達列 1 で「収束」する。scale 6 は楽観でも通路の
  # セル幅が足りず解けない。狭域追従が密な states をどう用立てるかは config/README.md と
  # vi_planner/src/core/compact.rs 冒頭。
  vi_planner:
    ros__parameters:
      solver: "frontier2d_sparse_compact"  # 断片も同じ値: 密だと 3.17GB で OOM。この地図では必須なので明示する
      map_scale: 5                         # 既定 1 (断片は未設定): 内部だけ 0.25m/cell (5650 万状態)
      downsample_policy: "optimistic"      # 既定 conservative (断片は未設定): 保守側だと通路のセル幅が死ぬ
      action_forward_m: [0.5, -0.3333, 0.0, 0.5, 0.0, 0.5]  # 前進の 3 つは断片と同値 (断片が 0.5 へ上がって並んだ。これ以上は velocity_smoother の上限で頭打ち)。後退だけ 5/3 倍のまま
      goal_margin_radius: 0.5              # 断片 0.3: ゴールセル数を 7 に保つ (セル比例)
      safety_radius_penalty: 1             # 断片 30: 30 だと貪欲ロールアウトが降下できない
      max_rollout_steps: 100000            # 断片 10000: 広域では遠い start から届かない
      cost_drawing_threshold: 600          # 断片 60: 色スケール上限 [ステップ数≒秒] ≒300m
      # ▲ 表示専用 (経路にもメモリにも影響しない)。**この地図は 1 ステップが 0.5m**
      #   (上の action_forward_m。断片と同値) なので、600 で 294.4x200m の地図をほぼ
      #   端まで階調に入れる。断片の 60 は 30m 相当しかなく、地図の大半が飽和して 1 色になる。
      #   **未計測** — 19F の 108 と違い実測の分布ではなく、地図の広がりから置いた見込み。
      #
      # 先読み。巡回では点が変わるたびに丸ごと 1 回の solve が入り、そのあいだ機体が
      # 止まる (この地図の実測で 87 秒。19F は 29 秒)。走行中に次の点を解いておいて
      # それを消す機能だが、**2026-08-08 に false へ戻した** (2026-08-07 に true へ
      # 上げたぶんの取り消しで、断片と同じ値になる)。走行中の固まりの容疑者が 2 つ
      # ——これと value_publish_interval_ms の全域スライス (下) ——残っているので、
      # 先にこちらを外して切り分ける。**巡回では点ごとに 87 秒止まる**のが代わりの代償。
      # 断片と同値だが**明示して残してある**のは、切り分けの途中だと分かるようにするため。
      # true へ戻すと場が 2 本生きて **sink 648MB x2 = 1.3GB** が匿名メモリに居座り
      # (断片の compact_ram_limit_mb 4096MB に収まるのでディスクへは出ない)、走行中ずっと
      # 1 コア (waypoint_prefetch_threads の既定 1) を solve に取られる。**4GB 機では
      # 戻さないこと。** 効いたかはログの "prefetched the value function for" /
      # "(..., prefetched)" で見る。2026-08-04 に断片で一度 true にしたときも同日の実機で
      # 走行中の固まりが出て、容疑者の 1 つとして戻した経緯がある (切り分けは未了)。
      waypoint_prefetch: false             # 断片も同じ値: 切り分けのため 2026-08-08 に true から戻した。巡回は点あたり 87 秒止まる
      # global_sweep と budget/idle は断片のまま (compact でもタイル修復として効く)。
      # **走行中に "global sweep done in" は出ない**のが設計どおりで、動いているかは
      # 2 秒ごとの "tile repair running for" のほうで見る (config/README.md)。

  # planner:=vi かつ local_planner:=nav2 (広域だけ VI) 用。解像度まわりと
  # safety_radius_penalty は上の vi_planner と同じ値にしてある。片方だけ変えると同じ地図
  # なのに 2 構成で別の経路が出て比較にならない。
  vi_global_planner:
    ros__parameters:
      solver: "frontier2d_sparse_compact"  # 断片も同じ値: states を確保しない。この地図では必須なので明示する
      map_scale: 5                         # 断片 1: 内部だけ 0.25m/cell (5650 万状態)
      downsample_policy: "optimistic"      # 既定 conservative (断片は未設定): 保守側だと通路のセル幅が死ぬ
      action_forward_m: [0.5, -0.3333, 0.0, 0.5, 0.0, 0.5]  # 前進の 3 つは断片と同値 (断片が 0.5 へ上がって並んだ。これ以上は velocity_smoother の上限で頭打ち)。後退だけ 5/3 倍のまま
      goal_margin_radius: 0.5              # 断片 0.3: ゴールセル数を 7 に保つ (セル比例)
      safety_radius_penalty: 1             # 断片 30: 30 だと貪欲ロールアウトが降下できない
      max_rollout_steps: 100000            # 断片 10000: 広域では遠い start から届かない
      cost_drawing_threshold: 600          # 断片 60: 同上 (vi_planner と揃える)

# ── ここで上書きしていないもの ────────────────────────────────────────────
# いずれも**未検証**。次も上書きが要るかもしれない。
#   costmaps.*.track_unknown_space / vi の unknown_as_obstacle … 未観測を通行可にするか。
#     今はどちらも「未観測 = 通れない」= 舗装路のみ通行可。
#   compact_sink_dir … 断片のまま ("" = RAM。ヘッダ)。**指定するとそちらが無条件に勝ち、
#     下の compact_ram_limit_mb は一切読まれない**。書くときは速い実ディスクにすること
#     (コンテナの /tmp は書き込み層 = SD カードで、追従が読むたび制御周期に響く)。
#   compact_ram_limit_mb … 断片が両ノードとも 4096MB。**この地図で効いている唯一の条件が
#     「この値 > sink 648MB」**で、4096 である必要はない。ノード既定の 512MB まで下げると
#     黙って /tmp/vi_*_sink = SD カードへ落ちる。
#   publish_value_function / value_publish_interval_ms … 断片の true / 500ms のまま。
#     **この地図では全域スライス 1 枚 (94 万セル) が重い**。掃きスレッドがそれをロックを
#     握ったまま 2 秒ごとに作るので、走行中に /cmd_vel_mux が 2 秒おきに途切れる恐れが
#     ある。2026-08-04 の実機はまさにこの止まり方だったが、犯人の切り分けは未了 —
#     再発したら value_publish_interval_ms: 0 をここへ足すのが戻し方 (config/README.md)。
