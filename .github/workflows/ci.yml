name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      publish_arm64:
        description: Raspberry Pi用arm64のCPU版とVulkan版をGHCRへ公開する
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ros:
    uses: ./.github/workflows/ci-ros2.yaml
  docker:
    uses: ./.github/workflows/ci-docker.yaml
  map-tools:
    uses: ./.github/workflows/ci-maps.yaml
  simulator:
    uses: ./.github/workflows/ci-simulator.yaml
  publish-arm64:
    needs: [ros, docker, map-tools, simulator]
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && inputs.publish_arm64)
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/ci-arm64.yaml
