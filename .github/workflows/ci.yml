# 外部ドライバや Rust プランナは変更せず、自前の構成・設定・ROS 配線を検査する。
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    container: ros:humble-ros-base
    env:
      PKGS_ALL: src/daifuku_config src/daifuku_bringup src/daifuku_robot src/daifuku_perception src/daifuku_localization src/daifuku_navigation src/daifuku_mapping src/daifuku_maps src/daifuku_rqt src/daifuku_waypoint_manager src/raspicat_driver
      PKGS_PY: src/daifuku_config src/daifuku_bringup src/daifuku_robot src/daifuku_perception src/daifuku_localization src/daifuku_navigation src/daifuku_mapping src/daifuku_rqt src/raspicat_driver
      PKGS_CMAKE: src/daifuku_config src/daifuku_bringup src/daifuku_robot src/daifuku_perception src/daifuku_localization src/daifuku_navigation src/daifuku_mapping src/daifuku_maps src/daifuku_waypoint_manager
    steps:
      - uses: actions/checkout@v4
      - name: linter を入れる
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            ros-humble-ament-copyright ros-humble-ament-flake8 \
            ros-humble-ament-lint-cmake ros-humble-ament-xmllint
      - name: lint
        run: |
          . /opt/ros/humble/setup.sh
          ament_copyright $PKGS_ALL
          ament_flake8 $PKGS_PY
          ament_lint_cmake $PKGS_CMAKE
          ament_xmllint $PKGS_CMAKE

  ros:
    runs-on: ubuntu-latest
    container: ros:humble-ros-base
    env:
      ROS_DOMAIN_ID: "77"
      ROS_LOCALHOST_ONLY: "1"
      PACKAGES: daifuku_config daifuku_maps daifuku_perception daifuku_localization daifuku_navigation daifuku_mapping raspicat_driver daifuku_robot daifuku_bringup
    steps:
      - uses: actions/checkout@v4
      - name: 構成テストの依存を入れる
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            cargo python3-pip python3-pytest python3-numpy ros-humble-ament-cmake-python ros-humble-ament-cmake-pytest \
            ros-humble-ament-lint-auto ros-humble-ament-cmake-copyright \
            ros-humble-ament-cmake-flake8 ros-humble-ament-cmake-lint-cmake \
            ros-humble-ament-cmake-xmllint ros-humble-launch-testing \
            ros-humble-launch-testing-ament-cmake ros-humble-nav2-common \
            ros-humble-diagnostic-updater
          pip3 install colcon-cargo colcon-ros-cargo
      - name: 自前の機能パッケージと公開入口をビルドする
        run: |
          . /opt/ros/humble/setup.sh
          colcon build --packages-select $PACKAGES
      - name: Docker の永続ビルドキャッシュと構成変更を検査する
        run: |
          . /opt/ros/humble/setup.sh
          python3 -m pytest -q docker/raspberrypi/tests
      - name: ROS ノード・設定監視・起動構成を検査する
        run: |
          . /opt/ros/humble/setup.sh
          . install/setup.sh
          colcon test --packages-select $PACKAGES
          colcon test-result --all --verbose
      - name: インストールされたノードの実行権限
        run: |
          for name in $(grep -rhoP 'executable="\K[\w]+\.py' src/*/launch | sort -u) config_sentinel site_manager; do
            entries=$(find install -path "*/lib/*/$name")
            test -n "$entries"
            for entry in $entries; do
              test -x "$entry"
              echo "ok $entry"
            done
          done
      - name: 全場所の設定と地図を検査する
        run: |
          . /opt/ros/humble/setup.sh
          . install/setup.sh
          python3 - <<'PY'
          import os
          from launch import LaunchContext
          from daifuku_config import params
          from daifuku_navigation_launch import nav2_params

          sites = params.available_overrides()
          assert sites, "sites/ is empty"
          for site in sites:
              for package in params.CONFIG_DIRS:
                  ok, why = params.precheck(site, package, params.config_root(package))
                  assert ok, f"{site} x {package}: {why}"
              context = LaunchContext()
              context.launch_configurations.update(overrides=site, extra_params_file="")
              for role, path in nav2_params.declared_maps(context).items():
                  assert os.path.isfile(path), f"{site} map:{role}: {path}"
              print(f"ok {site}")
          context = LaunchContext()
          context.launch_configurations.update(
              params_dir=os.path.join(params.config_root("daifuku_navigation"), "nav2"),
              params_file="",
          )
          nav2_params.fragments_resolver(context)
          PY

  map-tools:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: uv を入れる
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: map_19f を USD にして焼き戻す
        run: |
          uv run tools/maps/map_to_usd.py src/daifuku_maps/maps/19f/map_19f.yaml -o "$RUNNER_TEMP/world.usda"
          uv run tools/maps/verify_usda.py \
            src/daifuku_maps/maps/19f/map_19f.yaml "$RUNNER_TEMP/world.usda" free
      - name: 回廊の向きと順路の書式
        run: |
          uv run tools/maps/verify_corridor_orientation.py
          uv run tools/maps/verify_waypoints.py

  simulator:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: daifuku_autonomous/simulator
    steps:
      - uses: actions/checkout@v4
        with:
          path: daifuku_autonomous
      - name: uv を入れる
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - run: uv sync --locked
      - name: シミュレーション CLI と VTC の単体テスト
        run: uv run --locked --with pytest python -m pytest -q tests
