# 通常CIが成功したmain更新か、明示した手動実行だけから呼び出す。
name: Raspberry Pi ARM64 image

on:
  workflow_call:

jobs:
  publish:
    runs-on: ubuntu-24.04-arm
    # 初回はROSとRustの固定依存もソースから構築する。
    timeout-minutes: 180
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: docker/setup-buildx-action@v4
      - name: GHCRのイメージ名を決める
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - name: Raspberry Pi用のarm64イメージをビルドする
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/raspberrypi/Dockerfile
          target: runtime
          platforms: linux/arm64
          load: true
          tags: ${{ steps.image.outputs.name }}:sha-${{ github.sha }}-arm64
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=raspberrypi-arm64
          cache-to: type=gha,scope=raspberrypi-arm64,mode=max
      - name: arm64と実機用ワークスペースのビルドを確認する
        env:
          IMAGE: ${{ steps.image.outputs.name }}:sha-${{ github.sha }}-arm64
        run: |
          test "$(docker image inspect "$IMAGE" --format '{{.Os}}/{{.Architecture}}')" = linux/arm64
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -e HOME=/tmp -e ROS_HOME=/tmp/ros -e ROS_LOG_DIR=/tmp/ros/log \
            -e ROS_DOMAIN_ID=77 -e ROS_LOCALHOST_ONLY=1 \
            -e BUILD_JOBS=2 -e MAKEFLAGS=-j2 -e CARGO_BUILD_JOBS=2 \
            -v "$GITHUB_WORKSPACE:/opt/ros_ws" \
            "$IMAGE" build-workspace
      - name: GHCRへログインする
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      - name: 検証したイメージをGHCRへ公開する
        env:
          IMAGE_NAME: ${{ steps.image.outputs.name }}
          IMAGE_TAG: sha-${{ github.sha }}-arm64
        run: |
          docker push "$IMAGE_NAME:$IMAGE_TAG"
          if [[ "$GITHUB_REF" == refs/heads/main ]]; then
            docker tag "$IMAGE_NAME:$IMAGE_TAG" "$IMAGE_NAME:arm64"
            docker push "$IMAGE_NAME:arm64"
          fi
          printf 'ARM64 image: %s:%s\n' "$IMAGE_NAME" "$IMAGE_TAG" >> "$GITHUB_STEP_SUMMARY"
