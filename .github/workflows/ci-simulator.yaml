name: Simulator

on:
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: daifuku_autonomous/simulator
    steps:
      - uses: actions/checkout@v4
        with:
          path: daifuku_autonomous
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: "3.12"
          working-directory: daifuku_autonomous/simulator
          enable-cache: true
      - run: uv sync --locked --group test --python 3.12
      - name: シミュレーション CLI と VTC の単体テスト
        run: uv run --no-sync python -m pytest -q tests
