[project]
name = "daifuku-map-tools"
version = "0.1.0"
description = "CPU tools for measured point clouds and ROS occupancy maps"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.24",
  "pillow>=10.0",
  "pyyaml>=6.0",
  "scipy>=1.10",
]

[project.optional-dependencies]
usd = ["usd-core==25.5.1"]

[dependency-groups]
test = ["pytest>=8.0"]
